# Docker Compose configuration for ScrowPay AI Risk Engine
# For local development and testing

version: '3.8'

services:
  ai-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrowpay-ai-engine
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount models directory for persistence (optional)
      - ./models:/app/models
      # Mount synthetic data (optional)
      - ./synthetic_transactions.csv:/app/synthetic_transactions.csv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scrowpay-network

networks:
  scrowpay-network:
    driver: bridge
