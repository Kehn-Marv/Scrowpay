<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Session Management - ScrowPay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f5f7;
    }
    .test-section {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .test-result {
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-family: monospace;
      font-size: 14px;
    }
    .test-result.success {
      background-color: #d1fae5;
      color: #065f46;
    }
    .test-result.error {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .test-result.info {
      background-color: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>
<body class="min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-8">Session Management Test Suite</h1>
    
    <!-- Test 1: Create Session -->
    <div class="test-section">
      <h2 class="text-xl font-semibold mb-4">Test 1: Create Session</h2>
      <button id="btn-create-session" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">
        Create Test Session
      </button>
      <div id="result-create-session" class="test-result hidden"></div>
    </div>
    
    <!-- Test 2: Validate Session -->
    <div class="test-section">
      <h2 class="text-xl font-semibold mb-4">Test 2: Validate Session</h2>
      <button id="btn-validate-session" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
        Validate Session
      </button>
      <div id="result-validate-session" class="test-result hidden"></div>
    </div>
    
    <!-- Test 3: Get Session Info -->
    <div class="test-section">
      <h2 class="text-xl font-semibold mb-4">Test 3: Get Session Info</h2>
      <button id="btn-get-session-info" class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600">
        Get Session Info
      </button>
      <div id="result-get-session-info" class="test-result hidden"></div>
    </div>
    
    <!-- Test 4: Update Activity -->
    <div class="test-section">
      <h2 class="text-xl font-semibold mb-4">Test 4: Update Activity</h2>
      <button id="btn-update-activity" class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600">
        Update Activity
      </button>
      <div id="result-update-activity" class="test-result hidden"></div>
    </div>
    
    <!-- Test 5: Extend Session -->
    <div class="test-section">
      <h2 class="text-xl font-semibold mb-4">Test 5: Extend Session</h2>
      <button id="btn-extend-session" class="px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600">
        Extend Session
      </button>
      <div id="result-extend-session" class="test-result hidden"></div>
    </div>
    
    <!-- Test 6: Clear Session -->
    <div class="test-section">
      <h2 class="text-xl font-semibold mb-4">Test 6: Clear Session</h2>
      <button id="btn-clear-session" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
        Clear Session
      </button>
      <div id="result-clear-session" class="test-result hidden"></div>
    </div>
    
    <!-- Test 7: Check localStorage -->
    <div class="test-section">
      <h2 class="text-xl font-semibold mb-4">Test 7: Check localStorage</h2>
      <button id="btn-check-storage" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
        Check localStorage
      </button>
      <div id="result-check-storage" class="test-result hidden"></div>
    </div>
  </div>
  
  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="turso-db-service.js"></script>
  <script src="SessionService.js"></script>
  
  <script>
    // Initialize SessionService
    const sessionService = new SessionService({
      turso: {
        databaseUrl: window.CONFIG.turso.databaseUrl,
        authToken: window.CONFIG.turso.authToken
      }
    });
    
    // Helper function to display results
    function showResult(elementId, message, type = 'info') {
      const element = document.getElementById(elementId);
      element.textContent = message;
      element.className = `test-result ${type}`;
      element.classList.remove('hidden');
    }
    
    // Test 1: Create Session
    document.getElementById('btn-create-session').addEventListener('click', () => {
      try {
        const mockUser = {
          id: 1,
          phone_number: '+2348135866028',
          first_name: 'John',
          last_name: 'Doe',
          virtual_account_number: '1234567890'
        };
        
        const result = sessionService.createSession(mockUser);
        
        if (result.success) {
          showResult('result-create-session', 
            `✅ Session created successfully!\n` +
            `User ID: ${result.session.userId}\n` +
            `Phone: ${result.session.phoneNumber}\n` +
            `Expires: ${new Date(result.session.expiresAt).toLocaleString()}`,
            'success'
          );
        } else {
          showResult('result-create-session', `❌ Failed: ${result.message}`, 'error');
        }
      } catch (error) {
        showResult('result-create-session', `❌ Error: ${error.message}`, 'error');
      }
    });
    
    // Test 2: Validate Session
    document.getElementById('btn-validate-session').addEventListener('click', () => {
      try {
        const validation = sessionService.validateSession();
        
        if (validation.valid) {
          showResult('result-validate-session', 
            `✅ Session is valid!\n` +
            `User ID: ${validation.session.userId}\n` +
            `Phone: ${validation.session.phoneNumber}\n` +
            `First Name: ${validation.session.firstName}`,
            'success'
          );
        } else {
          showResult('result-validate-session', 
            `❌ Session is invalid!\n` +
            `Reason: ${validation.reason}`,
            'error'
          );
        }
      } catch (error) {
        showResult('result-validate-session', `❌ Error: ${error.message}`, 'error');
      }
    });
    
    // Test 3: Get Session Info
    document.getElementById('btn-get-session-info').addEventListener('click', () => {
      try {
        const session = sessionService.getSession();
        
        if (session) {
          const expiry = sessionService.getSessionExpiry();
          const inactivity = sessionService.getInactivityInfo();
          
          const timeRemainingHours = Math.floor(expiry.timeRemaining / (1000 * 60 * 60));
          const timeRemainingMinutes = Math.floor((expiry.timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
          
          const inactiveMinutes = Math.floor(inactivity.inactiveTime / (1000 * 60));
          const timeoutMinutes = Math.floor(inactivity.timeUntilTimeout / (1000 * 60));
          
          showResult('result-get-session-info', 
            `📊 Session Information:\n` +
            `User ID: ${session.userId}\n` +
            `Phone: ${session.phoneNumber}\n` +
            `Created: ${new Date(session.createdAt).toLocaleString()}\n` +
            `Expires: ${new Date(session.expiresAt).toLocaleString()}\n` +
            `Time Remaining: ${timeRemainingHours}h ${timeRemainingMinutes}m\n` +
            `Inactive Time: ${inactiveMinutes} minutes\n` +
            `Timeout In: ${timeoutMinutes} minutes`,
            'info'
          );
        } else {
          showResult('result-get-session-info', `❌ No active session found`, 'error');
        }
      } catch (error) {
        showResult('result-get-session-info', `❌ Error: ${error.message}`, 'error');
      }
    });
    
    // Test 4: Update Activity
    document.getElementById('btn-update-activity').addEventListener('click', () => {
      try {
        sessionService.updateActivity();
        
        const inactivity = sessionService.getInactivityInfo();
        const inactiveSeconds = Math.floor(inactivity.inactiveTime / 1000);
        
        showResult('result-update-activity', 
          `✅ Activity updated!\n` +
          `Last Activity: ${new Date(inactivity.lastActivity).toLocaleString()}\n` +
          `Inactive Time: ${inactiveSeconds} seconds`,
          'success'
        );
      } catch (error) {
        showResult('result-update-activity', `❌ Error: ${error.message}`, 'error');
      }
    });
    
    // Test 5: Extend Session
    document.getElementById('btn-extend-session').addEventListener('click', () => {
      try {
        const result = sessionService.extendSession();
        
        if (result.success) {
          const expiry = sessionService.getSessionExpiry();
          
          showResult('result-extend-session', 
            `✅ Session extended!\n` +
            `New Expiry: ${new Date(expiry.expiresAt).toLocaleString()}\n` +
            `Time Remaining: ${Math.floor(expiry.timeRemaining / (1000 * 60 * 60))} hours`,
            'success'
          );
        } else {
          showResult('result-extend-session', `❌ Failed: ${result.message}`, 'error');
        }
      } catch (error) {
        showResult('result-extend-session', `❌ Error: ${error.message}`, 'error');
      }
    });
    
    // Test 6: Clear Session
    document.getElementById('btn-clear-session').addEventListener('click', () => {
      try {
        sessionService.clearSession();
        
        showResult('result-clear-session', 
          `✅ Session cleared successfully!\n` +
          `localStorage has been cleaned up.`,
          'success'
        );
      } catch (error) {
        showResult('result-clear-session', `❌ Error: ${error.message}`, 'error');
      }
    });
    
    // Test 7: Check localStorage
    document.getElementById('btn-check-storage').addEventListener('click', () => {
      try {
        const sessionData = localStorage.getItem('scrowpay_session');
        const lastActivity = localStorage.getItem('scrowpay_last_activity');
        
        if (sessionData) {
          const session = JSON.parse(sessionData);
          
          showResult('result-check-storage', 
            `📦 localStorage Contents:\n` +
            `Session Key: scrowpay_session\n` +
            `User ID: ${session.userId}\n` +
            `Phone: ${session.phoneNumber}\n` +
            `Created: ${new Date(session.createdAt).toLocaleString()}\n` +
            `Expires: ${new Date(session.expiresAt).toLocaleString()}\n\n` +
            `Last Activity Key: scrowpay_last_activity\n` +
            `Last Activity: ${new Date(parseInt(lastActivity)).toLocaleString()}`,
            'info'
          );
        } else {
          showResult('result-check-storage', 
            `📦 localStorage is empty\n` +
            `No session data found.`,
            'info'
          );
        }
      } catch (error) {
        showResult('result-check-storage', `❌ Error: ${error.message}`, 'error');
      }
    });
  </script>
</body>
</html>
