<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ScrowPay</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- MediaPipe CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #caff04;
      --dark: #111111;
      --page-bg: #f2f2f0;
      --card-bg: #ffffff;
      --muted: #888888;
      --border: rgba(0,0,0,0.09);
      --radius: 24px;
      --shadow: 0 4px 32px rgba(0,0,0,0.07);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background blobs */
    body::before {
      content: '';
      position: fixed;
      top: -120px; right: -120px;
      width: 380px; height: 380px;
      background: var(--green);
      border-radius: 50%;
      opacity: 0.13;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; left: -100px;
      width: 300px; height: 300px;
      background: #111;
      border-radius: 50%;
      opacity: 0.05;
      pointer-events: none;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 32px 28px;
      width: 100%;
      max-width: 520px;
      border: 1px solid var(--border);
      animation: fadeUp 0.45s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px; font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 14px; color: var(--muted);
      margin-bottom: 28px;
    }

    /* Back button */
    .back-btn {
      display: flex; align-items: center; gap: 8px;
      background: transparent; border: none;
      color: var(--dark); font-size: 14px; font-weight: 500;
      cursor: pointer; margin-bottom: 20px;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--green); }
    .back-btn svg { width: 18px; height: 18px; }

    /* Field styles */
    .field-label {
      font-size: 13px; font-weight: 500;
      color: var(--dark); margin-bottom: 8px;
      display: block;
    }
    
    .input-field, select.input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; color: var(--dark);
      background: #fafafa;
      transition: all 0.2s;
    }
    .input-field:focus, select.input-field:focus {
      outline: none;
      border-color: var(--dark);
      background: #fff;
    }
    .input-field.error, select.input-field.error {
      border-color: #ef4444;
    }
    .input-field::placeholder { color: #bbb; }
    
    select.input-field {
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 3L8 6L4 9' stroke='%23888888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 40px;
    }
    
    select.input-field:disabled {
      background: #f0f0f0;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .phone-row {
      display: flex; align-items: center;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
      background: #fafafa;
    }
    .phone-row:focus-within { border-color: var(--dark); background: #fff; }
    .phone-row.error { border-color: #ef4444; }

    .phone-prefix {
      padding: 0 14px;
      font-size: 15px; font-weight: 500;
      color: var(--dark);
      border-right: 1.5px solid var(--border);
      height: 52px;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .phone-input {
      flex: 1; border: none; outline: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; color: var(--dark);
      padding: 0 16px;
      height: 52px;
    }

    .field-error {
      font-size: 12px; color: #ef4444;
      margin-top: 6px; min-height: 18px;
      display: block;
    }

    /* Buttons */
    .btn-primary {
      width: 100%; height: 54px;
      border-radius: 50px;
      border: none;
      background: var(--dark);
      color: var(--green);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover { background: #222; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { background: #ccc; color: #999; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-primary .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(202,255,4,0.3);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* PIN dots */
    .pin-dots {
      display: flex; gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid #ddd;
      background: transparent;
      transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
    }
    .pin-dot.filled {
      background: var(--dark);
      border-color: var(--dark);
      transform: scale(1.15);
    }
    .pin-dot.error-dot {
      border-color: #ef4444;
      background: #ef4444;
    }

    /* PIN Pad */
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .pin-key {
      height: 64px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: #fafafa;
      font-family: 'DM Sans', sans-serif;
      font-size: 20px; font-weight: 500;
      color: var(--dark);
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1px;
      transition: all 0.15s cubic-bezier(0.34,1.56,0.64,1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }
    .pin-key sub {
      font-size: 8px; font-weight: 500;
      color: var(--muted); letter-spacing: 0.08em;
      line-height: 1;
    }
    .pin-key:hover { background: #f0f0ee; border-color: #ccc; transform: scale(1.03); }
    .pin-key:active { transform: scale(0.95); background: #e8e8e5; }

    .pin-key.key-zero { grid-column: 2; }
    .pin-key.key-del {
      grid-column: 3;
      font-size: 18px;
      background: transparent;
      border-color: transparent;
    }
    .pin-key.key-del:hover { background: #fef2f2; border-color: #fecaca; }
    .pin-key.key-del svg { width: 22px; height: 22px; stroke: #888; fill: none; }

    /* Digit input boxes */
    .digit-input {
      width: 56px; height: 56px;
      text-align: center;
      font-size: 20px; font-weight: 600;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #fafafa;
      transition: all 0.2s;
    }
    .digit-input:focus {
      outline: none;
      border-color: var(--dark);
      background: #fff;
    }
    
    /* OTP/Digit container spacing */
    .digit-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Responsive digit inputs */
    @media (max-width: 480px) {
      .digit-input { 
        width: 44px; 
        height: 44px; 
        font-size: 18px; 
      }
      .digit-container {
        gap: 8px;
      }
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 500;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .modal-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px 28px;
      width: 100%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      animation: fadeUp 0.3s ease both;
    }
    .modal-title { font-family:'Syne',sans-serif; font-size:20px; font-weight:700; margin-bottom:8px; color:var(--dark); }
    .modal-msg { font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:24px; white-space: pre-line; }
    .modal-btns { display:flex; gap:10px; justify-content:flex-end; flex-wrap: wrap; }
    .modal-btn {
      padding: 10px 22px; border-radius: 50px;
      font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600;
      cursor:pointer; border:none; transition:all 0.18s;
    }
    .modal-btn.primary { background:var(--dark); color:var(--green); }
    .modal-btn.primary:hover { background:#222; }
    .modal-btn.ghost { background:#f0f0ee; color:var(--dark); }
    .modal-btn.ghost:hover { background:#e5e5e2; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--dark);
      color: var(--green);
      padding: 14px 24px;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 600;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      font-size: 14px; font-weight: 500;
      max-width: 90%;
      text-align: center;
    }
    .toast-container.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Info tile */
    .info-tile {
      padding: 16px;
      background: #f0f0ee;
      border-radius: 14px;
      display: flex;
      align-items: start;
      gap: 12px;
      margin-bottom: 20px;
    }
    .info-tile svg {
      width: 20px; height: 20px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .info-tile p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Video container for face verification */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      margin: 0 auto 20px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
    }
    #video {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .oval-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 80%;
      border: 4px solid var(--green);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }

    /* Shake animation */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%      { transform: translateX(-10px); }
      30%      { transform: translateX(10px); }
      45%      { transform: translateX(-8px); }
      60%      { transform: translateX(8px); }
      75%      { transform: translateX(-4px); }
      90%      { transform: translateX(4px); }
    }
    .shake { animation: shake 0.5s ease; }

    /* Ripple animation */
    @keyframes ripplePad {
      from { opacity: 1; transform: scale(0.6); }
      to   { opacity: 0; transform: scale(2); }
    }

    /* Loading spinner */
    .loading-spinner {
      width: 64px; height: 64px;
      border: 4px solid rgba(202,255,4,0.2);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    /* Success checkmark */
    .success-icon {
      width: 96px; height: 96px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .success-icon svg {
      width: 56px; height: 56px;
      stroke: var(--dark);
      stroke-width: 3;
    }
    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 28px 20px 24px; border-radius: 20px; }
      .pin-key { height: 58px; font-size: 18px; border-radius: 14px; }
      .card-title { font-size: 22px; }
      .digit-input { width: 40px; height: 40px; font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="card" id="stage-content">
    <!-- Stages will be dynamically rendered here -->
  </div>

  <!-- Toast -->
  <div id="toast" class="toast-container"></div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-msg" id="modal-msg"></div>
      <div class="modal-btns" id="modal-btns"></div>
    </div>
  </div>

  <!-- External services -->
  <script src="https://cdn.jsdelivr.net/npm/@libsql/client@0.3.5/dist/index.js"></script>
  <script src="env.js"></script>
  <script src="config.js"></script>
  <!--
    cloudinary-config.js MUST come before CloudinaryService.js — the
    service constructor reads window.CLOUDINARY_CONFIG at startup.
    Both files are gitignored / blank-safe: if cloud_name isn't set,
    the service reports `available === false` and the face capture
    step degrades to "skip" (legacy behavior, no reference stored).
  -->
  <script src="cloudinary-config.js"></script>
  <script src="CloudinaryService.js"></script>
  <script src="turso-db-service.js"></script>
  <script src="otp-service.js"></script>
  <script src="EmailOTPService.js"></script>
  <script src="id-validation-service.js"></script>
  <script src="squad-api-service.js"></script>
  <script src="mediapipe-service.js"></script>
  <script src="pin-service.js?v=2"></script>
  <script src="state-lga-area-data.js"></script>
  <script src="address-data-service.js"></script>
  <script src="SessionService.js"></script>

  <script>
    // PhoneValidationService
    class PhoneValidationService {
      static validateFormat(phone) {
        if (!phone || typeof phone !== 'string') return false;
        const cleaned = phone.replace(/\D/g, '');
        return (cleaned.length === 11 && cleaned.startsWith('0')) || (cleaned.length === 10 && !cleaned.startsWith('0'));
      }
      
      static normalizePhone(phone) {
        if (!phone || typeof phone !== 'string') throw new Error('Invalid phone number');
        const cleaned = phone.replace(/\D/g, '');
        const withoutLeadingZero = cleaned.startsWith('0') ? cleaned.substring(1) : cleaned;
        return `+234${withoutLeadingZero}`;
      }
    }

    // Helper function
    function capitalizeWords(str) {
      if (!str) return '';
      return str.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
    }

    // Registration State
    const registrationState = {
      currentStage: 1,
      phoneNumber: null,
      // Email captured on Stage 1; verified via OTP on Stage 2.
      // `emailVerified` only flips true after EmailOTPService.verifyOTP
      // returns ok — used to set users.email_verified=1 at saveUser time.
      email: null,
      emailVerified: false,
      idType: null,
      idNumber: null,
      firstName: null,
      middleName: null,
      lastName: null,
      dob: null,
      gender: null,
      currentAddress: { state: null, lga: null, area: null, addressText: null, landmark: null },
      permanentAddress: { state: null, lga: null, area: null, addressText: null },
      pin: null,
      virtualAccountNumber: null,
      bankCode: null,
      // Face reference image captured during the blink-detection step.
      // Stored as a Cloudinary secure_url on success; null if Cloudinary
      // isn't configured or the upload failed (the signup still
      // completes, but re-verification later won't have a baseline).
      faceReferenceUrl: null,
      faceReferenceUploadedAt: null,
      verificationStatus: { phoneVerified: false, otpVerified: false, idVerified: false, faceVerified: false }
    };

    // Build the CloudinaryService instance ONCE here so the face
    // capture flow (deep inside the renderStage7 closure) can find it
    // even though it doesn't have a reference to the module scope.
    let cloudinaryService = null;
    try {
      if (typeof CloudinaryService !== 'undefined') {
        cloudinaryService = new CloudinaryService();
        // Expose for any other script on this page that might want it.
        window.cloudinaryService = cloudinaryService;
      }
    } catch (e) {
      console.warn('[Signup] CloudinaryService init failed (face reference will be skipped):', e);
    }

    // EmailOTPService: same lazy pattern. We instantiate after the
    // dbService is connected (further down in initialize()) — but
    // declaring the slot here keeps the rest of the file's render
    // closures able to reference it without re-declaring.
    let emailOTPService = null;
    // Resolves (with the service) once EmailOTPService is ready,
    // or resolves with null if init fails. Used by the Stage 1 Next
    // handler to wait instead of silently skipping when the user
    // clicks Next before initialization finishes.
    let _emailOTPServiceReadyResolve;
    const emailOTPServiceReady = new Promise(res => { _emailOTPServiceReadyResolve = res; });

    /**
     * Grab the current frame from a live <video> element, encode it as
     * a JPEG blob, and upload it to Cloudinary's `scrowpay_face`
     * preset. On success, write the secure_url onto registrationState
     * so saveUser() picks it up at the PIN stage.
     *
     * Why JPEG @ 0.85? PNG would balloon the blob 4-5x (we don't need
     * transparency) and Cloudinary will re-encode anyway. 0.85 is the
     * standard sweet spot for face photos.
     *
     * Why no `await` at the call site? The user shouldn't see "still
     * uploading…" between the blink and the next stage — the upload
     * is a non-critical side-effect. Worst case (slow link), it
     * completes BEFORE the user reaches the PIN screen because the
     * file is small (~30-80 KB at 320x320).
     */
    async function captureAndUploadFaceReference(videoElement) {
      if (!cloudinaryService || !cloudinaryService.available) {
        console.warn('[Signup] Cloudinary not configured — skipping face reference upload.');
        return null;
      }
      if (!videoElement || !videoElement.videoWidth) {
        console.warn('[Signup] No video frame available to capture.');
        return null;
      }
      // Downscale to a reasonable face-crop size. The actual face
      // already occupies most of the frame; we don't need 1080p.
      const targetW = 480;
      const targetH = Math.round((videoElement.videoHeight / videoElement.videoWidth) * targetW);
      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      canvas.getContext('2d').drawImage(videoElement, 0, 0, targetW, targetH);

      // Convert to blob (async). `toBlob` returns null in some weird
      // edge cases (off-screen canvas etc.) so we guard.
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
      if (!blob) {
        console.warn('[Signup] canvas.toBlob returned null — skipping upload.');
        return null;
      }

      // We don't know the user_id yet (account isn't created) so we
      // tag the upload with the phone number (which is unique). The
      // admin can correlate later via Cloudinary's tag search.
      const phone = (registrationState.phoneNumber || 'unknown').replace(/\+/g, '');
      try {
        const result = await cloudinaryService.uploadFile(blob, 'face', {
          tags: ['type:face', 'purpose:signup', 'phone:' + phone],
          context: { phone, purpose: 'signup' }
        });
        registrationState.faceReferenceUrl = result.secureUrl;
        registrationState.faceReferenceUploadedAt = new Date().toISOString();
        console.log('[Signup] ✅ Face reference uploaded:', result.secureUrl);
        return result.secureUrl;
      } catch (uploadErr) {
        console.warn('[Signup] Face reference upload failed:', uploadErr.message || uploadErr);
        return null;
      }
    }

    // Initialize services
    const dbService = new TursoDBService(window.CONFIG.turso.databaseUrl, window.CONFIG.turso.authToken);
    const squadService = new SquadVirtualAccountService(window.CONFIG.squad.secretKey, window.CONFIG.squad.environment);
    const addressDataService = new AddressDataService();
    let addressDataLoaded = false;
    let dbConnected = false;

    // Load address data
    addressDataService.loadData()
      .then(() => {
        addressDataLoaded = true;
        console.log('[App] ✅ Address data loaded');
      })
      .catch(error => console.error('[App] ❌ Address data loading failed:', error));

    // Connect to database
    dbService.connect()
      .then(async () => {
        dbConnected = true;
        console.log('[App] ✅ Database connected');
        try {
          // Automatically initialize all schemas (users + escrow)
          await dbService.initializeAllSchemas();
          console.log('[App] ✅ All database schemas ready');
        } catch (schemaError) {
          console.error('[App] ⚠️ Schema initialization warning:', schemaError);
        }

        // Stand up the EmailOTPService now that the schema is in
        // place (it depends on the email_otps table created by
        // initializeAllSchemas). It needs its OWN dbService — passing
        // through CONFIG.turso here so the service builds an internal
        // TursoDBService it can call _executeHttp on.
        try {
          if (typeof EmailOTPService !== 'undefined') {
            emailOTPService = new EmailOTPService({
              turso: window.CONFIG.turso,
              aiEngine: window.CONFIG.aiEngine || { url: 'http://localhost:5000' }
            });
            await emailOTPService.connect();
            window.emailOTPService = emailOTPService;
            console.log('[App] ✅ EmailOTPService ready');
            _emailOTPServiceReadyResolve(emailOTPService);
          } else {
            _emailOTPServiceReadyResolve(null);
          }
        } catch (otpErr) {
          console.warn('[App] EmailOTPService init failed — signup will fall back to legacy 123456 OTP:', otpErr.message);
          _emailOTPServiceReadyResolve(null);
        }
      })
      .catch(error => {
        console.error('[App] ❌ Database connection failed:', error);
        showToast('Database connection failed. Please check your internet connection.', 5000);
        _emailOTPServiceReadyResolve(null);

      setTimeout(() => toast.classList.remove('active'), duration);

    // DigitInputBox Component
    class DigitInputBox {
      constructor(maxDigits, onChange = null, inputType = 'text') {
        this.maxDigits = maxDigits;
        this.onChange = onChange;
        this.inputType = inputType;
        this.inputs = [];
        this.container = null;
        this.actualValues = [];
      }
      
      render() {
        this.container = document.createElement('div');
        this.container.className = 'digit-container';
        
        for (let i = 0; i < this.maxDigits; i++) {
          const input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 1;
          input.className = 'digit-input';
          
          if (this.inputType === 'masked') this.actualValues[i] = '';
          
          input.addEventListener('input', (e) => {
            const digitValue = e.target.value.replace(/\D/g, '');
            
            if (this.inputType === 'masked') {
              if (digitValue) {
                this.actualValues[i] = digitValue.charAt(0);
                e.target.value = '•';
              } else {
                this.actualValues[i] = '';
                e.target.value = '';
              }
            } else {
              e.target.value = digitValue;
            }
            
            if (e.target.value && i < this.maxDigits - 1) {
              this.inputs[i + 1].focus();
            }
            
            if (this.onChange) this.onChange(this.getValue());
          });
          
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && i > 0) {
              this.inputs[i - 1].focus();
            }
          });
          
          this.inputs.push(input);
          this.container.appendChild(input);
        }
        
        return this.container;
      }
      
      getValue() {
        if (this.inputType === 'masked') return this.actualValues.join('');
        return this.inputs.map(input => input.value).join('');
      }
      
      setValue(value) {
        const digits = value.toString().split('');
        this.inputs.forEach((input, index) => {
          if (this.inputType === 'masked') {
            this.actualValues[index] = digits[index] || '';
            input.value = digits[index] ? '•' : '';
          } else {
            input.value = digits[index] || '';
          }
        });
      }
      
      focus() {
        if (this.inputs.length > 0) this.inputs[0].focus();
      }
      
      clear() {
        this.inputs.forEach(input => { input.value = ''; });
        if (this.inputType === 'masked') this.actualValues = [];
      }
    }

    // Stage Manager Class
    class StageManager {
      constructor() {
        this.currentStage = 1;
        this.totalStages = 10;
      }
      
      getCurrentStage() {
        return this.currentStage;
      }
      
      validateCurrentStage() {
        const errors = [];
        
        switch (this.currentStage) {
          case 1:
            if (!registrationState.phoneNumber) errors.push('Please enter a valid phone number');
            break;
          case 2:
            if (!registrationState.verificationStatus.otpVerified) errors.push('Please verify your phone number with the OTP code');
            break;
          case 3:
            if (!registrationState.idType || !registrationState.idNumber) errors.push('Please enter your BVN');
            break;
          case 4:
            if (!registrationState.firstName || !registrationState.lastName) errors.push('Please enter your first name and last name');
            break;
          case 5:
            if (!registrationState.verificationStatus.idVerified) errors.push('Identity verification must be completed');
            break;
          case 6:
            break;
          case 7:
            if (!registrationState.verificationStatus.faceVerified) errors.push('Please complete the face verification');
            break;
          case 8:
            const { currentAddress, permanentAddress } = registrationState;
            if (!currentAddress.state || !currentAddress.lga || !currentAddress.area || !currentAddress.addressText) {
              errors.push('Please complete all required address fields');
            }
            if (!permanentAddress.state || !permanentAddress.lga || !permanentAddress.area || !permanentAddress.addressText) {
              errors.push('Please complete permanent address information');
            }
            break;
          case 9:
            if (!registrationState.pin) errors.push('Please set up your 6-digit PIN');
            break;
        }
        
        return { isValid: errors.length === 0, errors: errors };
      }
      
      goToStage(stageNumber, skipValidation = false) {
        if (stageNumber < 1 || stageNumber > this.totalStages) {
          console.error(`Invalid stage number: ${stageNumber}`);
          return;
        }
        
        if (stageNumber < this.currentStage) {
          this.currentStage = stageNumber;
          registrationState.currentStage = stageNumber;
          this.renderCurrentStage();
          return;
        }
        
        if (!skipValidation && stageNumber > this.currentStage) {
          const validation = this.validateCurrentStage();
          if (!validation.isValid) {
            showModal('Validation Error', validation.errors.join('. '), [
              { text: 'OK', primary: true, onClick: () => {} }
            ]);
            return;
          }
        }
        
        this.currentStage = stageNumber;
        registrationState.currentStage = stageNumber;
        this.renderCurrentStage();
      }
      
      goToNextStage(skipValidation = false) {
        if (this.currentStage >= this.totalStages) {
          console.log('Already at the last stage');
          return;
        }
        
        if (!skipValidation) {
          const validation = this.validateCurrentStage();
          if (!validation.isValid) {
            showModal('Validation Error', validation.errors.join('. '), [
              { text: 'OK', primary: true, onClick: () => {} }
            ]);
            return;
          }
        }
        
        this.currentStage++;
        registrationState.currentStage = this.currentStage;
        this.renderCurrentStage();
      }
      
      goToPreviousStage() {
        if (this.currentStage > 1) {
          this.currentStage--;
          registrationState.currentStage = this.currentStage;
          this.renderCurrentStage();
        }
      }
      
      renderCurrentStage() {
        const stageContent = document.getElementById('stage-content');
        stageContent.innerHTML = '';
        
        switch (this.currentStage) {
          case 1: this.renderStage1(); break;
          case 2: this.renderStage2(); break;
          case 3: this.renderStage3(); break;
          case 4: this.renderStage4(); break;
          case 5: this.renderStage5(); break;
          case 6: this.renderStage6(); break;
          case 7: this.renderStage7(); break;
          case 8: this.renderStage8(); break;
          case 9: this.renderStage9(); break;
          case 10: this.renderStage10(); break;
          default:
            stageContent.innerHTML = '<p class="text-center" style="color: var(--muted);">Invalid stage</p>';
        }
      }

      // Stage 1: Phone Number + Email Entry
      //
      // PHASE D: we now collect the user's email here too. Email is
      // the channel for OTP verification on Stage 2 (real Resend
      // delivery, replacing the legacy hardcoded "123456"). Both
      // fields are validated client-side AND checked for duplicates
      // against the users table — phone via checkPhoneDuplicate,
      // email via checkEmailDuplicate (added on the dbService).
      renderStage1() {
        const stageContent = document.getElementById('stage-content');
        stageContent.innerHTML = `
          <h1 class="card-title">Get a ScrowPay Account</h1>
          <p class="card-sub">We'll use these to keep your account secure</p>
          
          <label class="field-label" for="phone-input">Phone Number</label>
          <div class="phone-row" id="phone-row">
            <div class="phone-prefix">🇳🇬 +234</div>

        phoneInput.addEventListener('input', (e) => {

        // Email: lightweight format check only on input. The real
        // RFC-ish validation (and duplicate check) happens on submit.
        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        emailInput.addEventListener('input', (e) => {
          const v = e.target.value.trim();

        nextBtn.addEventListener('click', async () => {
          const phoneValue = phoneInput.value.trim();

          // Phone validation
          if (!phoneValue) {
            phoneRow.classList.add('error');
            phoneError.textContent = 'Phone number is required';
            return;
          }
          if (!PhoneValidationService.validateFormat(phoneValue)) {
            phoneRow.classList.add('error');
            phoneError.textContent = 'Please enter a valid Nigerian phone number';
            return;
          }

          // Email validation
          if (!emailValue) {
            emailRow.classList.add('error');
            emailError.textContent = 'Email address is required';
            return;
          }
          if (!EMAIL_RE.test(emailValue)) {
            emailRow.classList.add('error');
            emailError.textContent = 'Please enter a valid email address';
            return;
          }
          
          const normalizedPhone = PhoneValidationService.normalizePhone(phoneValue);
          
          if (dbConnected) {
            try {
              nextBtn.disabled = true;
              nextBtn.textContent = 'Checking...';

              // Run the two duplicate checks in parallel — they're
              // independent SELECTs and saving 100-200ms here matters
              // since this is the first interactive step.
              const [phoneDup, emailDup] = await Promise.all([
                dbService.checkPhoneDuplicate(normalizedPhone),
                dbService.checkEmailDuplicate(emailValue)
              ]);

              if (phoneDup) {
                showModal('Phone Already Registered', 'This phone number is already registered with another account. Please use a different phone number or log in to your existing account.', [

                nextBtn.textContent = 'Next';

              }
            } catch (error) {
              console.error('Duplicate check failed:', error);
              showModal('Error', 'Failed to verify your details. Please try again.', [
                { text: 'OK', primary: true, onClick: () => {} }
              ]);
              nextBtn.disabled = false;
              nextBtn.textContent = 'Next';

            }
          }

          // Persist on the registration state so Stage 2 can read it.
          registrationState.phoneNumber = normalizedPhone;
          registrationState.email = emailValue;
          registrationState.verificationStatus.phoneVerified = true;
          // emailVerified stays false until OTP succeeds on Stage 2.
          registrationState.emailVerified = false;
          registrationState.verificationStatus.otpVerified = false;

          // Fire the OTP request BEFORE navigating to Stage 2 so the
          // email is already on its way by the time the user is
          // looking at the input box. If the service isn't ready yet
          // (its TursoDB connection is still in flight) we wait for

          try {
            // If emailOTPService is still null (init in flight), wait

            // can take several seconds on cold network.
            let svc = emailOTPService;
            if (!svc) {
              svc = await Promise.race([
                emailOTPServiceReady,
                new Promise(res => setTimeout(() => res(null), 30000))
              ]);
            }
            if (svc) {

                purpose: 'signup',
                name: ''
              });

            } else {

              showToast('Email service is taking longer than expected — try “Resend code” on the next screen', 5000);

            console.warn('[Stage1] OTP request failed:', otpErr);
            showToast('Could not send verification email — please try again on the next screen', 4000);

      // Stage 2: Email OTP Verification (Phase D)
      //
      // The OTP itself was already requested at the end of Stage 1
      // (so the email is in flight while the user navigates here).
      // We add a "Resend code" button on this screen for retries.
      //
      // Verification path:
      //   1. EmailOTPService.verifyOTP(email, code, 'signup')
      //      - hashes (email|purpose|code) and matches against the
      //        most recent live row in `email_otps`
      //      - increments attempts on mismatch; locks after 5
      //   2. On 'no_active_otp' (no OTP was ever sent — engine was
      //      unreachable at Stage 1) we fall back to legacy
      //      OTPService.verifyOTP("123456") so dev environments
      //      without Resend still work.
      renderStage2() {
        const stageContent = document.getElementById('stage-content');
        const recipient = registrationState.email || 'your email';
        stageContent.innerHTML = `
          <button id="back-btn" class="back-btn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            <span>Back</span>
          </button>
          
          <h1 class="card-title">Verify Your Email</h1>
          <p class="card-sub" style="margin-bottom: 20px;">Enter the 6-digit code we sent to <strong>${recipient}</strong></p>
          
          <div class="info-tile">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            <p>A verification code has been sent to your email. It may take a moment to arrive — check your spam folder if you don't see it.</p>
          </div>
          
          <label class="field-label">Enter 6-digit code</label>
          <div id="otp-input-container" style="margin-bottom: 20px;"></div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px;">
            <span style="color: var(--muted);">Didn't get it?</span>
            <button id="resend-btn" type="button" style="background: none; border: none; color: var(--dark); font-weight: 600; cursor: pointer; padding: 0;">Resend code</button>
          </div>
          
          <button id="verify-btn" class="btn-primary">Verify</button>
        `;
        
        document.getElementById('back-btn').addEventListener('click', () => this.goToPreviousStage());
        
        const otpInputBox = new DigitInputBox(6);
        const otpContainer = document.getElementById('otp-input-container');
        otpContainer.appendChild(otpInputBox.render());
        otpInputBox.focus();
        
        const verifyBtn = document.getElementById('verify-btn');
        const resendBtn = document.getElementById('resend-btn');
        const stage = this; // for use inside async handlers

        // ---- Resend code -------------------------------------------------
        // Cooldown: 30 seconds between resends so a user can't hammer
        // the Resend free tier. The Python endpoint also rate-limits
        // server-side, but local UX feedback feels better than waiting
        // for a 429.
        let resendCooldown = 0;
        function refreshResendUi() {
          if (resendCooldown > 0) {
            resendBtn.disabled = true;
            resendBtn.textContent = `Resend in ${resendCooldown}s`;
            resendBtn.style.opacity = '0.6';
          } else {
            resendBtn.disabled = false;
            resendBtn.textContent = 'Resend code';
            resendBtn.style.opacity = '1';
          }
        }
        const tickHandle = setInterval(() => {
          if (resendCooldown > 0) {
            resendCooldown--;
            refreshResendUi();
          }
        }, 1000);

        resendBtn.addEventListener('click', async () => {
          if (resendCooldown > 0) return;
          if (!emailOTPService) {
            showToast('Email service unavailable — try the test code 123456', 4000);
            return;
          }
          resendCooldown = 30;
          refreshResendUi();
          try {
            const result = await emailOTPService.requestOTP(registrationState.email, {
              purpose: 'signup'
            });
            if (result.delivered)        showToast('New code sent to ' + registrationState.email);
            else if (result.fallback)    showToast('Email service unavailable — use the test code 123456 in dev', 5000);
            else if (result.error)       showToast(result.error, 4000);
          } catch (err) {
            console.warn('[Stage2] resend failed:', err);
            showToast('Could not send code — please try again', 4000);
          }
        });

        // ---- Verify ------------------------------------------------------
        verifyBtn.addEventListener('click', async () => {
          const otp = otpInputBox.getValue();
          
          if (otp.length !== 6) {
            showModal('Error', 'Please enter the complete 6-digit code', [
              { text: 'OK', primary: true, onClick: () => {} }
            ]);

          verifyBtn.disabled = true;

          try {

              const result = await emailOTPService.verifyOTP(
                registrationState.email, otp, 'signup'
              );
              if (result.ok) {
                verified = true;

                // No OTP row exists — Stage 1 couldn't reach the
                // engine. Fall back to dev-mode hardcoded code so
                // local testing isn't blocked.
                console.warn('[Stage2] No live OTP — falling back to dev OTPService.');
                verified = OTPService.verifyOTP(otp);
              } else if (result.reason === 'expired') {
                showModal('Code Expired', 'That code has expired. Please tap "Resend code" to get a fresh one.', [
                  { text: 'OK', primary: true, onClick: () => { otpInputBox.clear(); otpInputBox.focus(); } }
                ]);
                return;
              } else if (result.reason === 'locked') {
                showModal('Too Many Attempts', 'You\u2019ve entered the wrong code too many times. Please tap "Resend code" to start over.', [
                  { text: 'OK', primary: true, onClick: () => { otpInputBox.clear(); otpInputBox.focus(); } }
                ]);
                return;
              } else {
                // mismatch / bad_format — show how many attempts left
                const left = result.attemptsLeft != null ? ` (${result.attemptsLeft} ${result.attemptsLeft === 1 ? 'try' : 'tries'} left)` : '';
                showModal('Incorrect Code', 'That code doesn\u2019t match' + left + '. Please double-check and try again.', [
                  { text: 'Retry', primary: true, onClick: () => { otpInputBox.clear(); otpInputBox.focus(); } }
                ]);
                return;
              }
            } else {
              // EmailOTPService failed to initialize at all — pure dev path.
              verified = OTPService.verifyOTP(otp);
              if (!verified) {
                showModal('Incorrect Code', 'That code doesn\u2019t match. Please try again.', [
                  { text: 'Retry', primary: true, onClick: () => { otpInputBox.clear(); otpInputBox.focus(); } }
                ]);
                return;
              }
            }

            if (verified) {
              clearInterval(tickHandle);
              registrationState.verificationStatus.otpVerified = true;
              registrationState.emailVerified = true;
              showModal('Succeeded!', 'Your email has been verified successfully!', [
                { text: 'Continue', primary: true, onClick: () => stage.goToNextStage() }
              ]);
            }
          } catch (err) {
            console.error('[Stage2] verify error:', err);
            showModal('Error', 'Could not verify the code. Please try again.', [
              { text: 'OK', primary: true, onClick: () => {} }
            ]);
          } finally {
            verifyBtn.disabled = false;
            verifyBtn.textContent = originalText;
          }
        });
        
        // Enter key support — anchored to the OTP input so it doesn't
        // leak across stages like the original `document`-level
        // listener did. (That listener stayed bound forever and could
        // re-trigger verify on later screens.)
        otpContainer.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') verifyBtn.click();
        });
      }

      // Stage 3: ID Information (BVN)
      renderStage3() {
        const stageContent = document.getElementById('stage-content');
        stageContent.innerHTML = `

        `;
        
        document.getElementById('back-btn').addEventListener('click', () => this.goToPreviousStage());
        
        const nextBtn = document.getElementById('next-btn');
        
        // Create BVN input with proper spacing
        const bvnInputBox = new DigitInputBox(11, null, 'masked');
        const idContainer = document.getElementById('id-input-container');

      async initializeBlinkDetection() {
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const statusMessage = document.getElementById('status-message');
        
        try {
          if (!MediaPipeService.isLibraryLoaded()) {
            throw new Error('MediaPipe libraries not loaded. Please refresh the page.');
          }
          
          const mediaPipeService = new MediaPipeService(videoElement, canvasElement);
          
          statusMessage.textContent = 'Loading face detection...';
          
          await mediaPipeService.initialize();
          
          statusMessage.textContent = 'Position your face in the oval and blink your eyes';
          
          await mediaPipeService.startDetection(() => {
            statusMessage.textContent = 'Blink detected! Processing...';

            // Capture ONE frame from the live video as a JPEG blob and
            // fire-and-forget the Cloudinary upload. We do NOT await
            // the upload — face verification UX should feel instant.
            // The URL is written to registrationState as soon as it
            // resolves, and saveUser() at the PIN stage picks it up.
            //
            // If Cloudinary is unavailable or the upload fails, the
            // signup still completes — registrationState.faceReferenceUrl
            // just stays null. Face re-verification (Phase F) will be
            // a no-op for accounts created in that state.
            try {
              captureAndUploadFaceReference(videoElement).catch(err =>
                console.warn('[Signup] Face reference upload failed (non-fatal):', err.message || err)
              );
            } catch (captureErr) {
              console.warn('[Signup] Face capture failed (non-fatal):', captureErr.message || captureErr);
            }

            mediaPipeService.stopDetection();

            registrationState.verificationStatus.faceVerified = true;

            setTimeout(() => {
              this.renderProcessingScreen();
            }, 500);
          });
          
        } catch (error) {
          console.error('Blink detection error:', error);
          
          let errorMessage = 'An error occurred during face verification.';
          
          if (error.name === 'NotAllowedError') {
            errorMessage = 'Camera access is required for face verification. Please enable camera access and try again.';
          } else if (error.name === 'NotFoundError') {
            errorMessage = 'No camera detected. Please connect a camera and try again.';
          } else if (error.message.includes('Camera') || error.message.includes('camera')) {
            errorMessage = 'Camera access is required for face verification. Please enable camera access and try again.';
          } else if (error.message.includes('MediaPipe')) {
            errorMessage = 'Unable to load face detection library. Please check your internet connection and try again.';
          } else if (error.message.includes('face') || error.message.includes('Face')) {
            errorMessage = 'Unable to detect your face. Please ensure your face is visible in the camera frame.';
          }
          
          statusMessage.textContent = errorMessage;
          statusMessage.style.color = '#ef4444';
          
          showModal('Error', errorMessage, [
            { text: 'Retry', primary: true, onClick: () => this.renderStage7() },
            { text: 'Go Back', primary: false, onClick: () => this.goToPreviousStage() }
          ]);
        }
      }

              const option = document.createElement('option');
              option.value = lga;
              option.textContent = capitalizeWords(lga);
              permanentLgaDropdown.appendChild(option);
            });
            permanentLgaDropdown.disabled = false;
          }
        });
        
        permanentLgaDropdown.addEventListener('change', () => {
          const state = permanentStateDropdown.value;
          const lga = permanentLgaDropdown.value;
          permanentAreaDropdown.innerHTML = '<option value="">Select Area</option>';
          permanentAreaDropdown.disabled = true;
          
          if (state && lga) {
            const areas = addressDataService.getWardsForLGA(state, lga);
            areas.forEach(area => {
              const option = document.createElement('option');
              option.value = area;
              option.textContent = capitalizeWords(area);
              permanentAreaDropdown.appendChild(option);
            });
            permanentAreaDropdown.disabled = false;
          }
        });
        
        // Same address checkbox
        sameAddressCheckbox.addEventListener('change', () => {
          if (sameAddressCheckbox.checked) {
            permanentAddressSection.style.display = 'none';
          } else {
            permanentAddressSection.style.display = 'block';
          }
        });
        
        // Pre-fill if data exists
        if (registrationState.currentAddress.state) {
          currentStateDropdown.value = registrationState.currentAddress.state;
          currentStateDropdown.dispatchEvent(new Event('change'));
          setTimeout(() => {
            if (registrationState.currentAddress.lga) {
              currentLgaDropdown.value = registrationState.currentAddress.lga;
              currentLgaDropdown.dispatchEvent(new Event('change'));
              setTimeout(() => {
                if (registrationState.currentAddress.area) {
                  currentAreaDropdown.value = registrationState.currentAddress.area;
                }
              }, 100);
            }
          }, 100);
          currentAddressInput.value = registrationState.currentAddress.addressText || '';
          currentLandmarkInput.value = registrationState.currentAddress.landmark || '';
        }
        
        // Next button
        nextBtn.addEventListener('click', () => {
          const currentState = currentStateDropdown.value;
          const currentLga = currentLgaDropdown.value;
          const currentArea = currentAreaDropdown.value;
          const currentAddress = currentAddressInput.value.trim();
          const currentLandmark = currentLandmarkInput.value.trim();
          
          if (!currentState || !currentLga || !currentArea || !currentAddress) {
            showModal('Error', 'Please complete all required current address fields', [
              { text: 'OK', primary: true, onClick: () => {} }
            ]);
            return;
          }
          
          registrationState.currentAddress = {
            state: currentState,
            lga: currentLga,
            area: currentArea,
            addressText: currentAddress,
            landmark: currentLandmark
          };
          
          if (sameAddressCheckbox.checked) {
            registrationState.permanentAddress = { ...registrationState.currentAddress };
          } else {
            const permanentState = permanentStateDropdown.value;
            const permanentLga = permanentLgaDropdown.value;
            const permanentArea = permanentAreaDropdown.value;
            const permanentAddress = permanentAddressInput.value.trim();
            
            if (!permanentState || !permanentLga || !permanentArea || !permanentAddress) {
              showModal('Error', 'Please complete all required permanent address fields', [
                { text: 'OK', primary: true, onClick: () => {} }
              ]);
              return;
            }
            
            registrationState.permanentAddress = {
              state: permanentState,
              lga: permanentLga,
              area: permanentArea,
              addressText: permanentAddress
            };
          }
          
          this.goToNextStage();
        });
        
        // Enter key support
        [currentAddressInput, currentLandmarkInput, permanentAddressInput].forEach(input => {
          input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              nextBtn.click();
            }
          });
        });
      }

      // Stage 9: PIN Setup
      renderStage9() {
        const stageContent = document.getElementById('stage-content');
        stageContent.innerHTML = `
          <button id="back-btn" class="back-btn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            <span>Back</span>
          </button>
          
          <h1 class="card-title">Set Up Your PIN</h1>
          <p class="card-sub">Create a 6-digit PIN to secure your account</p>
          
          <label class="field-label">6-Digit PIN</label>
          
          <div class="pin-dots" id="pin-dots">
            <div class="pin-dot" data-i="0"></div>
            <div class="pin-dot" data-i="1"></div>
            <div class="pin-dot" data-i="2"></div>
            <div class="pin-dot" data-i="3"></div>
            <div class="pin-dot" data-i="4"></div>
            <div class="pin-dot" data-i="5"></div>
          </div>
          
          <div class="pin-pad" id="pin-pad">
            <button class="pin-key" data-val="1">1</button>
            <button class="pin-key" data-val="2">2<sub>ABC</sub></button>
            <button class="pin-key" data-val="3">3<sub>DEF</sub></button>
            <button class="pin-key" data-val="4">4<sub>GHI</sub></button>
            <button class="pin-key" data-val="5">5<sub>JKL</sub></button>
            <button class="pin-key" data-val="6">6<sub>MNO</sub></button>
            <button class="pin-key" data-val="7">7<sub>PQRS</sub></button>
            <button class="pin-key" data-val="8">8<sub>TUV</sub></button>
            <button class="pin-key" data-val="9">9<sub>WXYZ</sub></button>
            <div></div>
            <button class="pin-key key-zero" data-val="0">0</button>
            <button class="pin-key key-del" id="del-btn" aria-label="Delete">
              <svg viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12H9m0 0l4-4m-4 4l4 4M3 12a9 9 0 110 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19 12H9l4-4M9 12l4 4"/></svg>
            </button>
          </div>
          
          <button id="complete-btn" class="btn-primary" style="margin-top: 20px;">Complete</button>
        `;
        
        document.getElementById('back-btn').addEventListener('click', () => this.goToPreviousStage());
        
        let pinDigits = [];
        const MAX = 6;
        
        const dotsEl = document.getElementById('pin-dots');
        const padEl = document.getElementById('pin-pad');
        const delBtn = document.getElementById('del-btn');
        const completeBtn = document.getElementById('complete-btn');
        
        function renderDots(isError = false) {
          dotsEl.querySelectorAll('.pin-dot').forEach((dot, i) => {
            dot.classList.remove('filled','error-dot');
            if (isError) { dot.classList.add('error-dot'); return; }
            if (i < pinDigits.length) dot.classList.add('filled');
          });
        }
        
        function shakeCard() {
          const card = document.getElementById('stage-content');
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
          card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
        }
        
        function triggerError() {
          renderDots(true);
          shakeCard();
          setTimeout(() => {
            pinDigits = [];
            renderDots();
          }, 700);
        }
        
        padEl.querySelectorAll('.pin-key[data-val]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (pinDigits.length >= MAX) return;
            pinDigits.push(btn.dataset.val);
            renderDots();
            const r = document.createElement('span');
            r.style.cssText = `position:absolute;width:100%;height:100%;left:0;top:0;background:rgba(0,0,0,0.06);border-radius:inherit;animation:ripplePad 0.3s ease;pointer-events:none;`;
            btn.appendChild(r);
            setTimeout(() => r.remove(), 320);
          });
        });
        
        delBtn.addEventListener('click', () => {
          if (!pinDigits.length) return;
          pinDigits.pop();
          renderDots();
        });
        
        document.addEventListener('keydown', (e) => {
          if (/^[0-9]$/.test(e.key) && pinDigits.length < MAX) {
            pinDigits.push(e.key); renderDots();
          }
          if (e.key === 'Backspace') { pinDigits.pop(); renderDots(); }
          if (e.key === 'Enter' && pinDigits.length === MAX) {
            completeBtn.click();
          }
        });
        
        completeBtn.addEventListener('click', async () => {
          if (pinDigits.length !== MAX) {
            triggerError();
            return;
          }
          
          const pin = pinDigits.join('');
          
          if (!dbConnected) {
            showModal('Connection Error', 'Unable to connect to database. Please check your internet connection and try again.', [
              { text: 'Retry', primary: true, onClick: () => completeBtn.click() },
              { text: 'Cancel', primary: false, onClick: () => {} }
            ]);
            return;
          }
          
          try {
            completeBtn.disabled = true;
            completeBtn.innerHTML = '<div class="spinner"></div>';
            
            const hashedPin = await PINService.hashPIN(pin, registrationState.phoneNumber);
            
            const userData = {
              phoneNumber: registrationState.phoneNumber,
              idType: registrationState.idType,
              idNumber: registrationState.idNumber,
              firstName: registrationState.firstName,
              middleName: registrationState.middleName,
              lastName: registrationState.lastName,
              dob: registrationState.dob,
              gender: registrationState.gender,
              virtualAccountNumber: registrationState.virtualAccountNumber,
              bankCode: registrationState.bankCode,
              currentAddress: registrationState.currentAddress,
              permanentAddress: registrationState.permanentAddress,
              hashedPin: hashedPin,
              // Face reference (Phase B). May be null if Cloudinary
              // wasn't configured or the upload was still in-flight
              // when the user reached this screen — in which case
              // re-verification later won't have a baseline.
              faceReferenceUrl: registrationState.faceReferenceUrl,
              faceReferenceUploadedAt: registrationState.faceReferenceUploadedAt,
              // Email + verification flag (Phase D). saveUser() will
              // only include `email_verified=1` when the user actually
              // passed the email-OTP step on Stage 2.
              email: registrationState.email,
              emailVerified: registrationState.emailVerified === true
            };
            
            const savedUser = await dbService.saveUser(userData);
            console.log('User saved to database:', savedUser);
            
            registrationState.pin = pin;
            
            completeBtn.disabled = false;
            completeBtn.textContent = 'Complete';
            
            this.goToNextStage();
            
          } catch (error) {
            console.error('Failed to save user:', error);
            showModal('Error', 'Failed to create account: ' + error.message, [
              { text: 'Retry', primary: true, onClick: () => completeBtn.click() },
              { text: 'Cancel', primary: false, onClick: () => {} }
            ]);
            completeBtn.disabled = false;
            completeBtn.textContent = 'Complete';
          }
        });
      }
      
      // Stage 10: Success Screen
      renderStage10() {
        const stageContent = document.getElementById('stage-content');
        stageContent.innerHTML = `
          <div style="text-align: center; cursor: pointer;" id="success-screen">
            <div class="success-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            
            <h1 class="card-title">Account Created Successfully!</h1>
            <p class="card-sub">Your ScrowPay account has been created and is ready to use.</p>
            
            <p style="font-size: 12px; color: var(--muted); opacity: 0.75; margin-top: 24px;">Click anywhere to continue</p>
          </div>
        `;
        
        const successScreen = document.getElementById('success-screen');
        successScreen.addEventListener('click', () => {
          this.dismissSuccessScreen();
        });
        
        const stageCard = document.getElementById('stage-content');
        stageCard.style.cursor = 'pointer';
        stageCard.addEventListener('click', () => {
          this.dismissSuccessScreen();
        });
      }
      
      async dismissSuccessScreen() {
        console.log('[Success] Account creation complete!');
        console.log('[Success] Registration State:', registrationState);
        
        try {
          const sessionService = new SessionService({
            turso: {
              databaseUrl: CONFIG.turso.databaseUrl,
              authToken: CONFIG.turso.authToken
            }
          });
          
          await sessionService.dbService.connect();
          const user = await sessionService.dbService.getUserByPhone(registrationState.phoneNumber);
          
          if (!user) {
            console.error('[Success] User not found in database after creation');
            const dashboardUrl = `dashboard.html?firstName=${encodeURIComponent(registrationState.firstName)}&phone=${encodeURIComponent(registrationState.phoneNumber)}&newUser=true`;
            window.location.href = dashboardUrl;
            return;
          }
          
          const sessionResult = sessionService.createSession(user);
          
          if (!sessionResult.success) {
            console.error('[Success] Failed to create session:', sessionResult.message);
            const dashboardUrl = `dashboard.html?firstName=${encodeURIComponent(registrationState.firstName)}&phone=${encodeURIComponent(registrationState.phoneNumber)}&newUser=true`;
            window.location.href = dashboardUrl;
            return;
          }
          
          console.log('[Success] ✅ Session created successfully');
          
          localStorage.setItem('scrowpay_first_time_user', 'true');
          
          window.dispatchEvent(new CustomEvent('accountCreationComplete', {
            detail: {
              phoneNumber: registrationState.phoneNumber,
              firstName: registrationState.firstName,
              lastName: registrationState.lastName,
              userId: user.id
            }
          }));
          
          console.log('[Success] Navigating to dashboard with session token');
          window.location.href = 'dashboard.html';
          
        } catch (error) {
          console.error('[Success] Error during session creation:', error);
          
          const dashboardUrl = `dashboard.html?firstName=${encodeURIComponent(registrationState.firstName)}&phone=${encodeURIComponent(registrationState.phoneNumber)}&newUser=true`;
          console.log('[Success] Falling back to URL parameters:', dashboardUrl);
          window.location.href = dashboardUrl;
        }
      }
    }
    
    // Initialize Stage Manager
    const stageManager = new StageManager();
    
    // Initialize the first stage on page load
    document.addEventListener('DOMContentLoaded', () => {
      stageManager.renderCurrentStage();
    });
  </script>
