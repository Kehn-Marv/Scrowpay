  <!-- Google Fonts - Inter -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;

    /* Custom styles for the account creation flow */

    }
    
    .stage-container.active {
      display: block;

    /* Button styles */
    .btn-primary {
      background-color: #caff04;
      color: #1c1c1c;
      font-weight: 600;
      padding: 1rem 2rem;
      border-radius: 9999px;
      transition: all 0.3s ease;

      cursor: pointer;

    .btn-primary:hover {
      background-color: #b8e600;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(202, 255, 4, 0.3);
    }
    
    .btn-primary:disabled {

      color: #9ca3af;
      cursor: not-allowed;
      transform: none;

    /* Input styles */

      width: 100%;

      box-shadow: 0 0 0 3px rgba(202, 255, 4, 0.1);
    }
    
    .input-field.error {
      border-color: #ef4444;
    }
    
    /* Card styles */
    .card {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 2rem;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
    
    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }
    
    /* Toast styles */
    .toast {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1c1c1c;
      color: #ffffff;
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s ease;
    }
    
    .toast.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    /* Video container styles for blink detection */
    .video-container {
      position: relative;
      width: 640px;
      height: 480px;
      max-width: 100%;
      margin: 0 auto;
      border-radius: 1.5rem;
      overflow: hidden;
      background: #000;
    }
    
    #video {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .oval-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 400px;
      border: 4px solid #caff04;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }
  </style>

<body class="min-h-screen bg-white">
  
  <!-- Main Container -->

    <div class="w-full max-w-2xl">
      
      <!-- Logo -->

  <script src="https://cdn.jsdelivr.net/npm/@libsql/client@0.3.5/dist/index.js"></script>

  <script src="squad-api-service.js"></script>
  
  <!-- MediaPipeService -->
  <script src="mediapipe-service.js"></script>
  
  <!-- PINService -->
  <script src="pin-service.js?v=2"></script>

  <script src="state-lga-area-data.js"></script>
  
  <!-- AddressDataService -->
  <script src="address-data-service.js"></script>
  
  <!-- SessionService -->
  <script src="SessionService.js"></script>
  
  <!-- JavaScript -->
  <script>
    // PhoneValidationService - Validates Nigerian phone number format
    class PhoneValidationService {
      /**
       * Validates Nigerian phone number format
       * Accepts: 08135866028 (11 digits with leading 0) or 8135866028 (10 digits without leading 0)
       * @param {string} phone - Phone number to validate
       * @returns {boolean} True if valid format, false otherwise
       */
      static validateFormat(phone) {
        if (!phone || typeof phone !== 'string') {
          return false;
        }
        
        const cleaned = phone.replace(/\D/g, '');
        
        // Check for 11 digits with leading 0
        if (cleaned.length === 11 && cleaned.startsWith('0')) {
          return true;
        }
        
        // Check for 10 digits without leading 0
        if (cleaned.length === 10 && !cleaned.startsWith('0')) {
          return true;
        }
        
        return false;
      }
      
      /**
       * Normalizes phone number to +234 format
       * Converts 08135866028 or 8135866028 to +2348135866028
       * @param {string} phone - Phone number to normalize
       * @returns {string} Normalized phone number in +234 format
       */
      static normalizePhone(phone) {
        if (!phone || typeof phone !== 'string') {
          throw new Error('Invalid phone number');
        }
        
        const cleaned = phone.replace(/\D/g, '');
        
        // Remove leading 0 if present
        const withoutLeadingZero = cleaned.startsWith('0') ? cleaned.substring(1) : cleaned;
        
        return `+234${withoutLeadingZero}`;
      }
    }
    
    // Helper function to capitalize words for display
    function capitalizeWords(str) {
      if (!str) return '';
      return str
        .split('-')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }
    
    // Registration State Object
    const registrationState = {
      currentStage: 1,
      phoneNumber: null,
      idType: null, // 'BVN' only (NIN not supported by Squad API)
      idNumber: null,
      firstName: null,
      middleName: null,
      lastName: null,
      dob: null, // Date of Birth in MM/DD/YYYY format
      gender: null, // '1' for Male, '2' for Female
      currentAddress: {
        state: null,
        lga: null,
        area: null,
        addressText: null,
        landmark: null
      },
      permanentAddress: {
        state: null,
        lga: null,
        area: null,
        addressText: null
      },
      pin: null,
      virtualAccountNumber: null, // Squad virtual account number
      bankCode: null, // Bank code (058 for GTBank)
      verificationStatus: {
        phoneVerified: false,
        otpVerified: false,
        idVerified: false,
        faceVerified: false
      }
    };
    
    // Initialize Turso DB Service from CONFIG
    const dbService = new TursoDBService(
      window.CONFIG.turso.databaseUrl,
      window.CONFIG.turso.authToken
    );
    
    // Initialize Squad Virtual Account Service from CONFIG
    const squadService = new SquadVirtualAccountService(
      window.CONFIG.squad.secretKey,
      window.CONFIG.squad.environment
    );
    
    // Initialize Address Data Service
    const addressDataService = new AddressDataService();
    let addressDataLoaded = false;
    
    // Load address data on page load (silently in background)
    console.log('[App] Loading address data...');
    addressDataService.loadData()
      .then(() => {
        addressDataLoaded = true;
        const stats = addressDataService.getDataStats();
        console.log('[App] ✅ Address data loaded successfully:', stats);
      })
      .catch(error => {
        console.error('[App] ❌ Address data loading failed:', error);
        // Don't show error toast on page load - only show when user reaches Stage 8
      });
    
    // Connect to database on page load
    let dbConnected = false;
    let dbConnectionError = null;
    
    console.log('[App] Initializing database connection...');
    
    dbService.connect()
      .then(async () => {
        dbConnected = true;
        console.log('[App] ✅ Database connected successfully');
        
        // Create schema if it doesn't exist
        try {
          await dbService.createSchema();
          console.log('[App] ✅ Database schema ready');
        } catch (schemaError) {
          console.error('[App] ⚠️ Schema creation warning:', schemaError);
          // Continue even if schema creation fails (table might already exist)
        }
      })
      .catch(error => {
        dbConnectionError = error;
        console.error('[App] ❌ Database connection failed:', error);
        showToast('Database connection failed. Please check your internet connection.', 5000);
      });
    
    // Stage Manager Class
    class StageManager {
      constructor() {
        this.currentStage = 1;
        this.totalStages = 10;
      }
      
      getCurrentStage() {
        return this.currentStage;
      }
      
      /**
       * Validates the current stage data before allowing transition
       * Returns an object with { isValid: boolean, errors: string[] }
       */
      validateCurrentStage() {
        const errors = [];
        
        switch (this.currentStage) {
          case 1: // Phone Number Entry
            if (!registrationState.phoneNumber) {
              errors.push('Please enter a valid phone number');
            }
            break;
            
          case 2: // OTP Verification
            if (!registrationState.verificationStatus.otpVerified) {
              errors.push('Please verify your phone number with the OTP code');
            }
            break;
            
          case 3: // ID Information Entry
            if (!registrationState.idType || !registrationState.idNumber) {
              errors.push('Please enter your BVN');
            }
            break;
            
          case 4: // Name Entry
            if (!registrationState.firstName || !registrationState.lastName) {
              errors.push('Please enter your first name and last name');
            }
            break;
            
          case 5: // Squad API Verification
            if (!registrationState.verificationStatus.idVerified) {
              errors.push('Identity verification must be completed');
            }
            break;
            
          case 6: // Face Verification Intro
            // No validation needed - just informational
            break;
            
          case 7: // Blink Detection
            if (!registrationState.verificationStatus.faceVerified) {
              errors.push('Please complete the face verification');
            }
            break;
            
          case 8: // Address Entry
            const { currentAddress, permanentAddress } = registrationState;
            if (!currentAddress.state || !currentAddress.lga || !currentAddress.area || !currentAddress.addressText) {
              errors.push('Please complete all required address fields');
            }
            if (!permanentAddress.state || !permanentAddress.lga || !permanentAddress.area || !permanentAddress.addressText) {
              errors.push('Please complete permanent address information');
            }
            break;
            
          case 9: // PIN Setup
            if (!registrationState.pin) {
              errors.push('Please set up your 6-digit PIN');
            }
            break;
        }
        
        return {
          isValid: errors.length === 0,
          errors: errors
        };
      }
      
      /**
       * Navigate to a specific stage with validation
       * @param {number} stageNumber - The stage number to navigate to
       * @param {boolean} skipValidation - Skip validation (for backward navigation)
       */
      goToStage(stageNumber, skipValidation = false) {
        if (stageNumber < 1 || stageNumber > this.totalStages) {
          console.error(`Invalid stage number: ${stageNumber}`);
          return;
        }
        
        // Allow backward navigation without validation
        if (stageNumber < this.currentStage) {
          this.currentStage = stageNumber;
          registrationState.currentStage = stageNumber;
          this.renderCurrentStage();
          return;
        }
        
        // For forward navigation, validate unless explicitly skipped
        if (!skipValidation && stageNumber > this.currentStage) {
          const validation = this.validateCurrentStage();
          if (!validation.isValid) {
            showModal('Validation Error', validation.errors.join('. '), [
              { text: 'OK', primary: true, onClick: () => {} }
            ]);
            return;
          }
        }
        
        this.currentStage = stageNumber;
        registrationState.currentStage = stageNumber;
        this.renderCurrentStage();
      }
      
      /**
       * Navigate to the next stage with validation
       * @param {boolean} skipValidation - Skip validation (use with caution)
       */
      goToNextStage(skipValidation = false) {
        if (this.currentStage >= this.totalStages) {
          console.log('Already at the last stage');
          return;
        }
        
        // Validate current stage before proceeding
        if (!skipValidation) {
          const validation = this.validateCurrentStage();
          if (!validation.isValid) {
            showModal('Validation Error', validation.errors.join('. '), [
              { text: 'OK', primary: true, onClick: () => {} }
            ]);
            return;
          }
        }
        
        this.currentStage++;
        registrationState.currentStage = this.currentStage;
        this.renderCurrentStage();
      }
      
      /**
       * Navigate to the previous stage (no validation needed)
       */
      goToPreviousStage() {
        if (this.currentStage > 1) {
          this.currentStage--;
          registrationState.currentStage = this.currentStage;
          this.renderCurrentStage();
        }
      }
      
      renderCurrentStage() {
        const stageContent = document.getElementById('stage-content');
        stageContent.innerHTML = '';
        
        // Render the appropriate stage
        switch (this.currentStage) {
          case 1:
            this.renderStage1();
            break;
          case 2:
            this.renderStage2();
            break;
          case 3:
            this.renderStage3();
            break;
          case 4:
            this.renderStage4();
            break;
          case 5:
            this.renderStage5();
            break;
          case 6:
            this.renderStage6();
            break;
          case 7:
            this.renderStage7();
            break;
          case 8:
            this.renderStage8();
            break;
          case 9:
            this.renderStage9();
            break;
          case 10:
            this.renderStage10();
            break;
          default:
            stageContent.innerHTML = '<p class="text-center text-brand-subtext">Invalid stage</p>';
        }
      }
      
      // Stage 1: Phone Number Entry
      renderStage1() {
        const stageContent = document.getElementById('stage-content');
        stageContent.innerHTML = `
          <h2 class="text-3xl font-semibold text-brand-dark mb-2">Get a ScrowPay Account</h2>
          <p class="text-brand-subtext mb-8">Enter your phone number to get started</p>
          <div class="mb-6">
            <label class="block text-sm font-medium text-brand-dark mb-2">Phone Number</label>
            <div class="flex items-center gap-2">
              <span class="text-brand-dark font-medium">🇳🇬 +234</span>
              <input type="tel" id="phone-input" class="input-field" placeholder="8135866028" maxlength="11">
            </div>
            <p id="phone-error" class="text-red-500 text-sm mt-2 hidden"></p>
          </div>
          <button id="next-btn" class="btn-primary w-full">Next</button>
        `;
        
        // Add event listeners
        const phoneInput = document.getElementById('phone-input');
        const nextBtn = document.getElementById('next-btn');
        const phoneError = document.getElementById('phone-error');
        
        // Pre-fill if phone number exists in state
        if (registrationState.phoneNumber) {
          phoneInput.value = registrationState.phoneNumber.replace('+234', '');
        }
        
        // Validate phone on input
        phoneInput.addEventListener('input', (e) => {
          const value = e.target.value;
          // Only allow digits
          e.target.value = value.replace(/\D/g, '');
          
          // Validate format
          if (e.target.value.length > 0) {
            const isValid = PhoneValidationService.validateFormat(e.target.value);
            if (!isValid) {
              phoneInput.classList.add('error');
              phoneError.textContent = 'Please enter a valid Nigerian phone number';
              phoneError.classList.remove('hidden');
            } else {
              phoneInput.classList.remove('error');
              phoneError.classList.add('hidden');
            }
          }
        });
        
        // Handle next button click
        nextBtn.addEventListener('click', async () => {
          const phoneValue = phoneInput.value.trim();
          
          if (!phoneValue) {
            phoneInput.classList.add('error');
            phoneError.textContent = 'Phone number is required';
            phoneError.classList.remove('hidden');
            return;
          }
          
          if (!PhoneValidationService.validateFormat(phoneValue)) {
            phoneInput.classList.add('error');
            phoneError.textContent = 'Please enter a valid Nigerian phone number';
            phoneError.classList.remove('hidden');
            return;
          }
          
          // Normalize phone number
          const normalizedPhone = PhoneValidationService.normalizePhone(phoneValue);
          
          // Check for duplicate phone number in database
          if (dbConnected) {
            try {
              nextBtn.disabled = true;
              nextBtn.textContent = 'Checking...';
              
              const isDuplicate = await dbService.checkPhoneDuplicate(normalizedPhone);
              
              if (isDuplicate) {
                showModal('Phone Already Registered', 'This phone number is already registered with another account. Please use a different phone number or log in to your existing account.', [
                  { text: 'OK', primary: true, onClick: () => {} }
                ]);
                nextBtn.disabled = false;
                nextBtn.textContent = 'Next';
                return;
              }
              
              nextBtn.disabled = false;
              nextBtn.textContent = 'Next';
            } catch (error) {
              console.error('Duplicate check failed:', error);
              showModal('Error', 'Failed to verify phone number. Please try again.', [
                { text: 'OK', primary: true, onClick: () => {} }
              ]);
              nextBtn.disabled = false;
              nextBtn.textContent = 'Next';
              return;
            }
          }
          
          // Store phone number
          registrationState.phoneNumber = normalizedPhone;
          registrationState.verificationStatus.phoneVerified = true;
          
          // Proceed to next stage
          this.goToNextStage();
        });
      }
      
      // Stage 2: OTP Verification
      renderStage2() {
        const stageContent = document.getElementById('stage-content');
        stageContent.innerHTML = `
          <!-- Back Button -->
          <button id="back-btn" class="mb-4 flex items-center gap-2 text-brand-dark hover:text-brand-green transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            <span class="font-medium">Back</span>
          </button>
          
          <h2 class="text-3xl font-semibold text-brand-dark mb-8">Verify Your Phone Number</h2>
          
          <!-- Step 1 Tile: Message with OTP Icon -->
          <div class="mb-6 p-4 bg-brand-gray rounded-xl flex items-start gap-3">
            <div class="flex-shrink-0">
              <svg class="w-6 h-6 text-brand-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              </svg>
            </div>
            <div class="flex-1">
              <p class="text-brand-subtext text-sm">
                A verification code has been sent to your phone number ${registrationState.phoneNumber || '+234XXXXXXXXXX'}, please take a look
              </p>
            </div>
          </div>
          
          <!-- Step 2 Tile: OTP Entry -->
          <div class="mb-6 p-6 bg-white border-2 border-gray-200 rounded-xl">
            <label class="block text-sm font-medium text-brand-dark mb-4">Enter 6-digit OTP</label>
            <div id="otp-input-container"></div>
          </div>
          
          <button id="verify-btn" class="btn-primary w-full">Verify</button>
        `;
        
        // Add back button handler
        const backBtn = document.getElementById('back-btn');
        backBtn.addEventListener('click', () => {
          this.goToPreviousStage();
        });
        
        // Show toast notification
        showToast('A verification code has been sent to your mobile phone');
        
        // Create DigitInputBox for OTP
        const otpInputBox = new DigitInputBox(6);
        const otpContainer = document.getElementById('otp-input-container');
        otpContainer.appendChild(otpInputBox.render());
        
        // Focus first input
        otpInputBox.focus();
        
        // Handle verify button
        const verifyBtn = document.getElementById('verify-btn');
        verifyBtn.addEventListener('click', () => {
          const otp = otpInputBox.getValue();
          
          if (otp.length !== 6) {
            showModal('Error', 'Please enter the complete 6-digit OTP code', [
              { text: 'OK', primary: true, onClick: () => {} }
            ]);
            return;
          }
          
          // Verify OTP using OTPService
          if (OTPService.verifyOTP(otp)) {
            registrationState.verificationStatus.otpVerified = true;
            showModal('Succeeded!', 'Your Phone Number has been verified successfully!', [
              { text: 'Continue', primary: true, onClick: () => this.goToNextStage() }
            ]);
          } else {
            showModal('Failed!', 'Verification code error', [
              { text: 'Retry', primary: true, onClick: () => {
                // Clear OTP inputs
                otpInputBox.clear();
                otpInputBox.focus();
              }}
            ]);
          }
        });
      }
      
      // Stage 3: ID Information
      renderStage3() {
        const stageContent = document.getElementById('stage-content');
        stageContent.innerHTML = `
          <!-- Back Button -->
          <button id="back-btn" class="mb-4 flex items-center gap-2 text-brand-dark hover:text-brand-green transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            <span class="font-medium">Back</span>
          </button>
          
          <h2 class="text-3xl font-semibold text-brand-dark mb-4">Enter your ID information</h2>
          <p class="text-brand-subtext mb-8">Please provide your BVN to verify your account opening application</p>

      async initializeBlinkDetection() {
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const statusMessage = document.getElementById('status-message');
        
        try {
          // Check if MediaPipe libraries are loaded
          if (!MediaPipeService.isLibraryLoaded()) {
            throw new Error('MediaPipe libraries not loaded. Please refresh the page.');
          }
          
          // Create MediaPipeService instance
          const mediaPipeService = new MediaPipeService(videoElement, canvasElement);
          
          // Update status
          statusMessage.textContent = 'Loading face detection...';
          
          // Initialize MediaPipe
          await mediaPipeService.initialize();
          
          // Update status
          statusMessage.textContent = 'Position your face in the oval and blink your eyes';
          
          // Start blink detection
          await mediaPipeService.startDetection(() => {
            // Blink detected!
            statusMessage.textContent = 'Blink detected! Processing...';
            
            // Stop detection
            mediaPipeService.stopDetection();
            
            // Update registration state
            registrationState.verificationStatus.faceVerified = true;
            
            // Proceed to processing screen (Stage 7.5 - Face Verification Processing)
            setTimeout(() => {
              this.renderProcessingScreen();
            }, 500);
          });
          
        } catch (error) {
          console.error('Blink detection error:', error);
          
          // Handle different error types
          let errorMessage = 'An error occurred during face verification.';
          let retryOption = true;
          
          // Camera access denied (Requirement 17.3)
          if (error.name === 'NotAllowedError') {
            errorMessage = 'Camera access is required for face verification. Please enable camera access and try again.';
          } 
          // No camera available (Requirement 17.3)
          else if (error.name === 'NotFoundError') {
            errorMessage = 'No camera detected. Please connect a camera and try again.';
          }
          // Camera-related errors (Requirement 17.3)
          else if (error.message.includes('Camera') || error.message.includes('camera')) {
            errorMessage = 'Camera access is required for face verification. Please enable camera access and try again.';
          } 
          // MediaPipe initialization failure (Requirement 17.4)
          else if (error.message.includes('MediaPipe')) {
            errorMessage = 'Unable to load face detection library. Please check your internet connection and try again.';
          }
          // Face detection failure (Requirement 17.4)
          else if (error.message.includes('face') || error.message.includes('Face')) {
            errorMessage = 'Unable to detect your face. Please ensure your face is visible in the camera frame.';
          }
          
          statusMessage.textContent = errorMessage;
          statusMessage.classList.add('text-red-500');
          
          // Show error modal with retry and go back options
          if (retryOption) {
            showModal('Error', errorMessage, [
              { text: 'Retry', primary: true, onClick: () => this.renderStage7() },
              { text: 'Go Back', primary: false, onClick: () => this.goToPreviousStage() }
            ]);
          }
        }
      }

    // DigitInputBox Component Class
    class DigitInputBox {
      /**
       * Creates a reusable digit input component for multi-digit inputs
       * @param {number} maxDigits - Number of digit input boxes to render
       * @param {function} onChange - Optional callback function called when value changes
       * @param {string} inputType - Type of input ('text', 'password', 'masked')
       */
      constructor(maxDigits, onChange = null, inputType = 'text') {
        this.maxDigits = maxDigits;
        this.onChange = onChange;
        this.inputType = inputType;
        this.inputs = [];
        this.container = null;
        this.actualValues = []; // Store actual values for masked inputs
      }
      
      /**
       * Renders the digit input boxes and returns the container element
       * @returns {HTMLElement} Container element with all digit input boxes
       */
      render() {
        // Create container
        this.container = document.createElement('div');
        this.container.className = 'flex gap-2 justify-center';
        
        // Create individual input boxes
        for (let i = 0; i < this.maxDigits; i++) {
          const input = document.createElement('input');
          input.type = 'text'; // Always use text type for custom masking
          input.maxLength = 1;
          input.className = 'digit-input w-12 h-12 text-center text-xl font-semibold border-2 border-gray-300 rounded-lg focus:border-brand-green focus:outline-none';
          
          // Initialize actual value storage for masked inputs
          if (this.inputType === 'masked') {
            this.actualValues[i] = '';
          }
          
          // Add input event listener for auto-focus
          input.addEventListener('input', (e) => {
            // Only allow digits
            const digitValue = e.target.value.replace(/\D/g, '');
            
            // For masked input, store actual value and display dot
            if (this.inputType === 'masked') {
              if (digitValue) {
                this.actualValues[i] = digitValue.charAt(0);
                e.target.value = '•'; // Display dot instead of digit
              } else {
                this.actualValues[i] = '';
                e.target.value = '';
              }
            } else {
              e.target.value = digitValue;
            }
            
            // Auto-focus next input if value entered
            if (e.target.value && i < this.maxDigits - 1) {
              this.inputs[i + 1].focus();
            }
            
            // Call onChange callback if provided
            if (this.onChange) {
              this.onChange(this.getValue());
            }
          });
          
          // Add keydown event listener for backspace handling
          input.addEventListener('keydown', (e) => {
            // Move to previous input on backspace if current input is empty
            if (e.key === 'Backspace' && !e.target.value && i > 0) {
              this.inputs[i - 1].focus();
            }
          });
          
          this.inputs.push(input);
          this.container.appendChild(input);
        }
        
        return this.container;
      }
      
      /**
       * Gets the current value from all digit inputs as a concatenated string
       * @returns {string} Concatenated value of all digit inputs
       */
      getValue() {
        // For masked inputs, return actual values instead of displayed dots
        if (this.inputType === 'masked') {
          return this.actualValues.join('');
        }
        return this.inputs.map(input => input.value).join('');
      }
      
      /**
       * Sets the value of the digit inputs from a string
       * @param {string} value - String value to set (will be split into individual digits)
       */
      setValue(value) {
        const digits = value.toString().split('');
        this.inputs.forEach((input, index) => {
          if (this.inputType === 'masked') {
            // Store actual value and display dot
            this.actualValues[index] = digits[index] || '';
            input.value = digits[index] ? '•' : '';
          } else {
            input.value = digits[index] || '';
          }
        });
      }
      
      /**
       * Focuses the first input box
       */
      focus() {
        if (this.inputs.length > 0) {
          this.inputs[0].focus();
        }
      }
      
      /**
       * Clears all input values
       */
      clear() {
        this.inputs.forEach(input => {
          input.value = '';
        });
        // Clear actual values for masked inputs
        if (this.inputType === 'masked') {
          this.actualValues = [];
        }
      }
    }
    
    // Modal Component Class
    class Modal {
      constructor() {
        this.modalElement = document.getElementById('modal');
        this.titleElement = document.getElementById('modal-title');
        this.messageElement = document.getElementById('modal-message');
        this.buttonsContainer = document.getElementById('modal-buttons');
      }
      
      /**
       * Show the modal with specified title, message, and buttons
       * @param {string} title - Modal title
       * @param {string} message - Modal message
       * @param {Array} buttons - Array of button objects with { text, primary, onClick }
       */
      show(title, message, buttons = []) {
        this.titleElement.textContent = title;
        this.messageElement.textContent = message;
        this.buttonsContainer.innerHTML = '';
        
        buttons.forEach(button => {
          const btn = document.createElement('button');
          btn.textContent = button.text;
          btn.className = button.primary 
            ? 'btn-primary' 
            : 'px-4 py-2 text-brand-dark font-medium hover:bg-gray-100 rounded-full transition-colors';
          
          btn.onclick = () => {
            this.hide();
            if (button.onClick) button.onClick();
          };
          
          this.buttonsContainer.appendChild(btn);
        });
        
        this.modalElement.classList.add('active');
      }
      
      /**
       * Hide the modal
       */
      hide() {
        this.modalElement.classList.remove('active');
      }
    }
    
    // Toast Component Class
    class Toast {
      constructor() {
        this.toastElement = document.getElementById('toast');
        this.timeoutId = null;
      }
      
      /**
       * Show the toast notification with auto-dismiss after specified duration
       * @param {string} message - Toast message to display
       * @param {number} duration - Duration in milliseconds before auto-dismiss (default: 3000)
       */
      show(message, duration = 3000) {
        // Clear any existing timeout
        if (this.timeoutId) {
          clearTimeout(this.timeoutId);
        }
        
        // Set message and show toast
        this.toastElement.textContent = message;
        this.toastElement.classList.add('active');
        
        // Auto-dismiss after duration
        this.timeoutId = setTimeout(() => {
          this.hide();
        }, duration);
      }
      
      /**
       * Hide the toast notification
       */
      hide() {
        this.toastElement.classList.remove('active');
        if (this.timeoutId) {
          clearTimeout(this.timeoutId);
          this.timeoutId = null;
        }
      }
    }
    
    // Initialize Modal and Toast instances
    const modal = new Modal();
    const toast = new Toast();
    
    // UI Helper Functions
    function showToast(message, duration = 3000) {
      toast.show(message, duration);
    }
    
    // Legacy helper functions for backward compatibility
    function showModal(title, message, buttons = []) {
      modal.show(title, message, buttons);
    }
    
    function hideModal() {
      modal.hide();
    }
    
    // Initialize Stage Manager
    const stageManager = new StageManager();
    
    // Initialize the first stage on page load
    document.addEventListener('DOMContentLoaded', () => {
      stageManager.renderCurrentStage();
    });
  </script>
  
</body>
</html>
