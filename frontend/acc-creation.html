<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ScrowPay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#1c1c1c',
              green: '#caff04',
              gray: '#f5f5f7',
              text: '#111111',
              subtext: '#666666'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    /* ── Card ── */
    .card {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 2rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      width: 100%;
    }
    @media (max-width: 480px) {
      .card { padding: 1.25rem; border-radius: 1rem; }
    }

    /* ── Buttons ── */
    .btn-primary {
      background-color: #caff04;
      color: #1c1c1c;
      font-weight: 600;
      padding: 0.875rem 2rem;
      border-radius: 9999px;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      display: block;
    }
    .btn-primary:hover  { background-color: #b8e600; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(202,255,4,0.3); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { background-color: #e5e7eb; color: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-secondary {
      background: transparent;
      color: #1c1c1c;
      font-weight: 500;
      padding: 0.875rem 1.5rem;
      border-radius: 9999px;
      border: 2px solid #e5e7eb;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover { border-color: #caff04; background: #f9ffe0; }

    /* ── Inputs ── */
    .input-field {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 0.75rem;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #fff;
      color: #111;
      font-family: 'Inter', sans-serif;
      appearance: none;
      -webkit-appearance: none;
    }
    .input-field:focus  { outline: none; border-color: #caff04; box-shadow: 0 0 0 3px rgba(202,255,4,0.15); }
    .input-field.error  { border-color: #ef4444; }
    .input-field:disabled { background: #f5f5f7; color: #9ca3af; cursor: not-allowed; }

    /* ── Digit Input Boxes ── */
    .digit-inputs-wrap {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      width: 100%;
    }
    .digit-input {
      flex: 1;
      min-width: 0;           /* allow shrinking */
      max-width: 3rem;
      height: 3rem;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
      border: 2px solid #e5e7eb;
      border-radius: 0.5rem;
      transition: border-color 0.2s;
      font-family: 'Inter', sans-serif;
      background: #fff;
    }
    .digit-input:focus { outline: none; border-color: #caff04; box-shadow: 0 0 0 3px rgba(202,255,4,0.15); }
    @media (max-width: 380px) {
      .digit-input { height: 2.5rem; font-size: 1rem; border-radius: 0.375rem; }
      .digit-inputs-wrap { gap: 0.25rem; }
    }

    /* ── Modal ── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    .modal-buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
    .modal-buttons .btn-primary  { width: auto; padding: 0.75rem 1.5rem; }
    .modal-buttons .btn-secondary { padding: 0.75rem 1.25rem; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: #1c1c1c;
      color: #fff;
      padding: 0.875rem 1.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s ease;
      white-space: nowrap;
      max-width: calc(100vw - 2rem);
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.9rem;
    }
    .toast.active { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── ID toggle buttons ── */
    .id-toggle-group { display: flex; gap: 0.75rem; }
    .id-toggle-btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      border: 2px solid #e5e7eb;
      font-weight: 500;
      font-size: 0.95rem;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }
    .id-toggle-btn.active { background: #caff04; border-color: #caff04; }

    /* ── Video / face verification ── */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      margin: 0 auto;
      border-radius: 1.25rem;
      overflow: hidden;
      background: #000;
    }
    #video  { display: none; width: 100%; height: 100%; object-fit: cover; }
    #canvas { width: 100%; height: 100%; display: block; }
    .oval-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 55%; height: 75%;
      border: 4px solid #caff04;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }

    /* ── Progress bar ── */
    .stage-progress-bar {
      height: 4px;
      background: #e5e7eb;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .stage-progress-fill {
      height: 100%;
      background: #caff04;
      border-radius: 9999px;
      transition: width 0.4s ease;
    }

    /* ── Gender radio ── */
    .gender-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.75rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 0.75rem;
      flex: 1;
      transition: all 0.2s;
      font-weight: 500;
    }
    .gender-option input { accent-color: #caff04; width: 1.1rem; height: 1.1rem; }
    .gender-option:has(input:checked) { border-color: #caff04; background: #f9ffe0; }

    /* ── DOB row ── */
    .dob-row { display: flex; gap: 0.5rem; }
    .dob-row .input-field { padding: 0.875rem 0.5rem; font-size: 0.875rem; }
    @media (max-width: 380px) {
      .dob-row { flex-direction: column; }
    }

    /* ── Address section ── */
    .address-section { border: 2px solid #e5e7eb; border-radius: 1rem; padding: 1.25rem; }
    .address-section h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }

    /* ── Success screen ── */
    .success-checkmark {
      width: 5.5rem; height: 5.5rem;
      background: #caff04;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }

    /* ── Heading sizes ── */
    .stage-heading { font-size: clamp(1.5rem, 5vw, 1.875rem); font-weight: 600; color: #1c1c1c; margin-bottom: 0.5rem; line-height: 1.2; }
    .stage-sub     { color: #666; margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.5; }

    /* ── Checkbox ── */
    .same-address-label {
      display: flex; align-items: center; gap: 0.6rem;
      cursor: pointer; font-weight: 500; font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    .same-address-label input[type="checkbox"] { accent-color: #caff04; width: 1.1rem; height: 1.1rem; }

    /* ── Spinner ── */
    .spinner {
      width: 4rem; height: 4rem;
      border: 4px solid #e5e7eb;
      border-top-color: #caff04;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Percentage counter ── */
    .pct-counter { font-size: 3rem; font-weight: 700; color: #caff04; text-align: center; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
</head>
<body class="min-h-screen bg-white">

  <!-- Page wrapper -->
  <div class="min-h-screen flex items-center justify-center p-4 md:p-8">
    <div class="w-full" style="max-width: 560px;">

      <!-- Logo -->
      <div class="flex items-center justify-center gap-3 mb-8">
        <div class="w-11 h-11 rounded-full flex items-center justify-center" style="background:#caff04">
          <svg fill="none" height="26" viewBox="0 0 24 24" width="26" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12C4 12 7.5 7 12 12C16.5 17 20 12 20 12" stroke="#1c1c1c" stroke-linecap="round" stroke-width="2"/>
            <path d="M4 16C4 16 7.5 11 12 16C16.5 21 20 16 20 16" stroke="#1c1c1c" stroke-linecap="round" stroke-width="2"/>
            <path d="M4 8C4 8 7.5 3 12 8C16.5 13 20 8 20 8"   stroke="#1c1c1c" stroke-linecap="round" stroke-width="2"/>
          </svg>
        </div>
        <span style="font-size:1.4rem;font-weight:600;color:#1c1c1c;letter-spacing:.05em">ScrowPay</span>
      </div>

      <!-- Stage card -->
      <div id="stage-content" class="card"></div>

    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title"   style="font-size:1.3rem;font-weight:600;color:#1c1c1c;margin-bottom:.75rem"></h3>
      <p  id="modal-message" style="color:#666;font-size:.95rem;white-space:pre-line;line-height:1.6"></p>
      <div id="modal-buttons" class="modal-buttons"></div>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@libsql/client@0.3.5/dist/index.js"></script>
  <script src="env.js"></script>
  <script src="config.js"></script>
  <script src="turso-db-service.js"></script>
  <script src="otp-service.js"></script>
  <script src="id-validation-service.js"></script>
  <script src="squad-api-service.js"></script>
  <script src="mediapipe-service.js"></script>
  <script src="pin-service.js?v=2"></script>
  <script src="address-data-service.js"></script>

  <script>
  /* ─────────────────────────────────────────────
     Phone validation
  ───────────────────────────────────────────── */
  class PhoneValidationService {
    static validateFormat(phone) {
      if (!phone || typeof phone !== 'string') return false;
      const c = phone.replace(/\D/g,'');
      if (c.length===11 && c.startsWith('0')) return true;
      if (c.length===10 && !c.startsWith('0')) return true;
      return false;
    }
    static normalizePhone(phone) {
      const c = phone.replace(/\D/g,'');
      const w = c.startsWith('0') ? c.substring(1) : c;
      return `+234${w}`;
    }
  }

  function capitalizeWords(str) {
    if (!str) return '';
    return str.split('-').map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
  }

  /* ─────────────────────────────────────────────
     Registration state
  ───────────────────────────────────────────── */
  const registrationState = {
    currentStage:1, phoneNumber:null, idType:null, idNumber:null,
    firstName:null, middleName:null, lastName:null, dob:null, gender:null,
    currentAddress:{state:null,lga:null,area:null,addressText:null,landmark:null},
    permanentAddress:{state:null,lga:null,area:null,addressText:null},
    pin:null, virtualAccountNumber:null, bankCode:null,
    verificationStatus:{phoneVerified:false,otpVerified:false,idVerified:false,faceVerified:false}
  };

  /* ─────────────────────────────────────────────
     Services (guard against missing scripts)
  ───────────────────────────────────────────── */
  let dbService=null, squadService=null, addressDataService=null;
  let dbConnected=false, addressDataLoaded=false;

  try {
    dbService = new TursoDBService(window.CONFIG.turso.databaseUrl, window.CONFIG.turso.authToken);
    squadService = new SquadVirtualAccountService(window.CONFIG.squad.secretKey, window.CONFIG.squad.environment);
    addressDataService = new AddressDataService();

    addressDataService.loadData().then(()=>{
      addressDataLoaded=true;
    }).catch(e=>console.error('[App] Address data load failed:',e));

    dbService.connect().then(async()=>{
      dbConnected=true;
      try{ await dbService.createSchema(); }catch(e){}
    }).catch(e=>{ console.error('[App] DB connect failed:',e); showToast('Database connection failed. Check your internet connection.',5000); });
  } catch(e) {
    console.warn('[App] Service init skipped (missing config/service files):',e.message);
  }

  /* ─────────────────────────────────────────────
     Toast & Modal helpers
  ───────────────────────────────────────────── */
  let toastTimeout=null;
  function showToast(msg,duration=3000){
    const el=document.getElementById('toast');
    el.textContent=msg;
    el.classList.add('active');
    if(toastTimeout) clearTimeout(toastTimeout);
    toastTimeout=setTimeout(()=>el.classList.remove('active'),duration);
  }

  function showModal(title,message,buttons=[]){
    document.getElementById('modal-title').textContent=title;
    document.getElementById('modal-message').textContent=message;
    const bc=document.getElementById('modal-buttons');
    bc.innerHTML='';
    buttons.forEach(b=>{
      const btn=document.createElement('button');
      btn.textContent=b.text;
      if(b.primary){
        btn.className='btn-primary';
        btn.style.cssText='width:auto;padding:.75rem 1.5rem';
      } else {
        btn.className='btn-secondary';
        btn.style.cssText='padding:.75rem 1.25rem';
      }
      btn.onclick=()=>{ hideModal(); if(b.onClick) b.onClick(); };
      bc.appendChild(btn);
    });
    document.getElementById('modal').classList.add('active');
  }
  function hideModal(){ document.getElementById('modal').classList.remove('active'); }

  /* ─────────────────────────────────────────────
     DigitInputBox component
  ───────────────────────────────────────────── */
  class DigitInputBox {
    constructor(maxDigits,onChange=null,inputType='text'){
      this.maxDigits=maxDigits; this.onChange=onChange;
      this.inputType=inputType; this.inputs=[]; this.actualValues=[];
    }
    render(){
      this.container=document.createElement('div');
      this.container.className='digit-inputs-wrap';
      for(let i=0;i<this.maxDigits;i++){
        const input=document.createElement('input');
        input.type='text'; input.maxLength=1;
        input.className='digit-input';
        input.setAttribute('inputmode','numeric');
        if(this.inputType==='masked') this.actualValues[i]='';
        input.addEventListener('input',e=>{
          const v=e.target.value.replace(/\D/g,'');
          if(this.inputType==='masked'){
            if(v){ this.actualValues[i]=v.charAt(0); e.target.value='•'; }
            else { this.actualValues[i]=''; e.target.value=''; }
          } else { e.target.value=v; }
          if(e.target.value && i<this.maxDigits-1) this.inputs[i+1].focus();
          if(this.onChange) this.onChange(this.getValue());
        });
        input.addEventListener('keydown',e=>{
          if(e.key==='Backspace' && !e.target.value && i>0) this.inputs[i-1].focus();
        });
        this.inputs.push(input);
        this.container.appendChild(input);
      }
      return this.container;
    }
    getValue(){ return this.inputType==='masked' ? this.actualValues.join('') : this.inputs.map(i=>i.value).join(''); }
    setValue(val){
      const digits=val.toString().split('');
      this.inputs.forEach((inp,idx)=>{
        if(this.inputType==='masked'){
          this.actualValues[idx]=digits[idx]||'';
          inp.value=digits[idx]?'•':'';
        } else { inp.value=digits[idx]||''; }
      });
    }
    focus(){ if(this.inputs.length>0) this.inputs[0].focus(); }
    clear(){ this.inputs.forEach(i=>i.value=''); if(this.inputType==='masked') this.actualValues=[]; }
  }

  /* ─────────────────────────────────────────────
     Progress bar helper
  ───────────────────────────────────────────── */
  function renderProgressBar(stage,total){
    const pct=Math.round((stage/total)*100);
    return `<div class="stage-progress-bar"><div class="stage-progress-fill" style="width:${pct}%"></div></div>`;
  }

  /* ─────────────────────────────────────────────
     StageManager
  ───────────────────────────────────────────── */
  class StageManager {
    constructor(){ this.currentStage=1; this.totalStages=10; }

    validateCurrentStage(){
      const e=[];
      switch(this.currentStage){
        case 1: if(!registrationState.phoneNumber) e.push('Please enter a valid phone number'); break;
        case 2: if(!registrationState.verificationStatus.otpVerified) e.push('Please verify your phone number'); break;
        case 3: if(!registrationState.idType||!registrationState.idNumber) e.push('Please enter your BVN or NIN'); break;
        case 4: if(!registrationState.firstName||!registrationState.lastName) e.push('Please enter your first and last name'); break;
        case 5: if(!registrationState.verificationStatus.idVerified) e.push('Identity verification must be completed'); break;
        case 7: if(!registrationState.verificationStatus.faceVerified) e.push('Please complete face verification'); break;
        case 8: {
          const ca=registrationState.currentAddress;
          if(!ca.state||!ca.lga||!ca.area||!ca.addressText) e.push('Please complete all current address fields');
          const pa=registrationState.permanentAddress;
          if(!pa.state||!pa.lga||!pa.area||!pa.addressText) e.push('Please complete permanent address fields');
          break;
        }
        case 9: if(!registrationState.pin) e.push('Please set up your 6-digit PIN'); break;
      }
      return {isValid:e.length===0,errors:e};
    }

    goToStage(n,skipValidation=false){
      if(n<1||n>this.totalStages) return;
      if(n<this.currentStage){ this.currentStage=n; registrationState.currentStage=n; this.render(); return; }
      if(!skipValidation&&n>this.currentStage){
        const v=this.validateCurrentStage();
        if(!v.isValid){ showModal('Required',v.errors.join('\n'),[{text:'OK',primary:true,onClick:()=>{}}]); return; }
      }
      this.currentStage=n; registrationState.currentStage=n; this.render();
    }

    next(skip=false){
      if(this.currentStage>=this.totalStages) return;
      if(!skip){ const v=this.validateCurrentStage(); if(!v.isValid){ showModal('Required',v.errors.join('\n'),[{text:'OK',primary:true,onClick:()=>{}}]); return; } }
      this.currentStage++; registrationState.currentStage=this.currentStage; this.render();
    }

    prev(){
      if(this.currentStage>1){ this.currentStage--; registrationState.currentStage=this.currentStage; this.render(); }
    }

    render(){
      const el=document.getElementById('stage-content');
      el.innerHTML='';
      const map={1:'s1',2:'s2',3:'s3',4:'s4',5:'s5',6:'s6',7:'s7',8:'s8',9:'s9',10:'s10'};
      this[map[this.currentStage]||'s1']();
    }

    /* ── Stage 1: Phone ── */
    s1(){
      const sc=document.getElementById('stage-content');
      sc.innerHTML=`
        ${renderProgressBar(1,10)}
        <h2 class="stage-heading">Get a ScrowPay Account</h2>
        <p class="stage-sub">Enter your phone number to get started</p>
        <div style="margin-bottom:1.25rem">
          <label style="display:block;font-size:.875rem;font-weight:500;color:#1c1c1c;margin-bottom:.5rem">Phone Number</label>
          <div style="display:flex;align-items:center;gap:.75rem;background:#f5f5f7;border:2px solid #e5e7eb;border-radius:.75rem;padding:.875rem 1rem;transition:border-color .2s" id="phone-wrap">
            <span style="font-weight:600;color:#1c1c1c;white-space:nowrap">🇳🇬 +234</span>
            <input type="tel" id="phone-input" inputmode="numeric" placeholder="8135866028" maxlength="11"
              style="flex:1;border:none;background:transparent;font-size:1rem;outline:none;font-family:inherit;min-width:0;color:#111">
          </div>
          <p id="phone-error" style="color:#ef4444;font-size:.85rem;margin-top:.4rem;display:none"></p>
        </div>
        <button id="next-btn" class="btn-primary">Continue</button>
      `;
      const wrap=document.getElementById('phone-wrap');
      const inp=document.getElementById('phone-input');
      const err=document.getElementById('phone-error');
      const btn=document.getElementById('next-btn');
      if(registrationState.phoneNumber) inp.value=registrationState.phoneNumber.replace('+234','');
      inp.addEventListener('focus',()=>wrap.style.borderColor='#caff04');
      inp.addEventListener('blur',()=>wrap.style.borderColor='#e5e7eb');
      inp.addEventListener('input',e=>{
        e.target.value=e.target.value.replace(/\D/g,'');
        if(e.target.value.length>0 && !PhoneValidationService.validateFormat(e.target.value)){
          err.textContent='Please enter a valid Nigerian phone number'; err.style.display='block';
        } else { err.style.display='none'; }
      });
      btn.addEventListener('click',async()=>{
        const v=inp.value.trim();
        if(!v||!PhoneValidationService.validateFormat(v)){
          err.textContent='Please enter a valid Nigerian phone number'; err.style.display='block'; return;
        }
        const norm=PhoneValidationService.normalizePhone(v);
        if(dbConnected&&dbService){
          try{
            btn.disabled=true; btn.textContent='Checking...';
            const dup=await dbService.checkPhoneDuplicate(norm);
            if(dup){ showModal('Already Registered','This phone number is already registered. Please sign in instead.',[{text:'OK',primary:true,onClick:()=>{}}]); btn.disabled=false;btn.textContent='Continue';return; }
            btn.disabled=false;btn.textContent='Continue';
          }catch(e){btn.disabled=false;btn.textContent='Continue';}
        }
        registrationState.phoneNumber=norm;
        registrationState.verificationStatus.phoneVerified=true;
        this.next(true);
      });
    }

    /* ── Stage 2: OTP ── */
    s2(){
      const sc=document.getElementById('stage-content');
      sc.innerHTML=`
        ${renderProgressBar(2,10)}
        <h2 class="stage-heading">Verify Your Number</h2>
        <div style="background:#f5f5f7;border-radius:.75rem;padding:1rem;display:flex;gap:.75rem;align-items:flex-start;margin-bottom:1.25rem">
          <svg width="20" height="20" fill="none" stroke="#666" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:2px"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <p style="font-size:.875rem;color:#666;line-height:1.5">A verification code was sent to <strong style="color:#1c1c1c">${registrationState.phoneNumber||''}</strong></p>
        </div>
        <label style="display:block;font-size:.875rem;font-weight:500;color:#1c1c1c;margin-bottom:.75rem">Enter 6-digit OTP</label>
        <div id="otp-wrap" style="margin-bottom:1.5rem"></div>
        <button id="verify-btn" class="btn-primary">Verify</button>
      `;
      showToast('Verification code sent to your phone');
      const box=new DigitInputBox(6);
      document.getElementById('otp-wrap').appendChild(box.render());
      box.focus();
      document.getElementById('verify-btn').addEventListener('click',()=>{
        const otp=box.getValue();
        if(otp.length!==6){ showModal('Incomplete','Please enter the full 6-digit code',[{text:'OK',primary:true,onClick:()=>{}}]); return; }
        if(typeof OTPService!=='undefined'&&OTPService.verifyOTP(otp)){
          registrationState.verificationStatus.otpVerified=true;
          showModal('Verified! 🎉','Your phone number has been verified.',[{text:'Continue',primary:true,onClick:()=>this.next(true)}]);
        } else {
          showModal('Incorrect Code','The OTP you entered is wrong. Please try again.',[{text:'Retry',primary:true,onClick:()=>{box.clear();box.focus();}}]);
        }
      });
    }

    /* ── Stage 3: ID ── */
    s3(){
      const sc=document.getElementById('stage-content');
      sc.innerHTML=`
        ${renderProgressBar(3,10)}
        <h2 class="stage-heading">Enter Your ID</h2>
        <p class="stage-sub">Provide your BVN or NIN to verify your identity</p>
        <div class="id-toggle-group" style="margin-bottom:1.25rem">
          <button id="nin-btn" class="id-toggle-btn active">NIN</button>
          <button id="bvn-btn" class="id-toggle-btn">BVN</button>
        </div>
        <div id="id-wrap" style="margin-bottom:1.5rem"></div>
        <button id="next-btn" class="btn-primary">Continue</button>
      `;
      const ninBtn=document.getElementById('nin-btn');
      const bvnBtn=document.getElementById('bvn-btn');
      let selType=registrationState.idType||'NIN';
      const box=new DigitInputBox(11,null,'masked');
      document.getElementById('id-wrap').appendChild(box.render());
      if(registrationState.idNumber) box.setValue(registrationState.idNumber);
      box.focus();
      const setActive=t=>{ selType=t; registrationState.idType=t;
        if(t==='NIN'){ninBtn.classList.add('active');bvnBtn.classList.remove('active');}
        else{bvnBtn.classList.add('active');ninBtn.classList.remove('active');}
      };
      setActive(selType);
      ninBtn.addEventListener('click',()=>{setActive('NIN');box.clear();box.focus();});
      bvnBtn.addEventListener('click',()=>{setActive('BVN');box.clear();box.focus();});
      const btn=document.getElementById('next-btn');
      btn.addEventListener('click',async()=>{
        const id=box.getValue();
        let vr;
        if(typeof IDValidationService!=='undefined'){
          vr=selType==='BVN'?IDValidationService.validateBVN(id):IDValidationService.validateNIN(id);
          if(!vr.isValid){ showModal('Invalid ID',vr.error,[{text:'OK',primary:true,onClick:()=>box.focus()}]); return; }
        }
        if(dbConnected&&dbService){
          try{
            btn.disabled=true;btn.textContent='Checking...';
            const dup=await dbService.checkIDDuplicate(id,selType);
            if(dup){ showModal(`${selType} Already Registered`,`This ${selType} is linked to another account.`,[{text:'OK',primary:true,onClick:()=>{box.clear();box.focus();}}]); btn.disabled=false;btn.textContent='Continue';return; }
            btn.disabled=false;btn.textContent='Continue';
          }catch(e){btn.disabled=false;btn.textContent='Continue';}
        }
        showModal(`Confirm Your ${selType}`,`Please confirm:\n\n${id}`,[
          {text:'Edit',primary:false,onClick:()=>box.focus()},
          {text:'Confirm',primary:true,onClick:()=>{ registrationState.idNumber=id;registrationState.idType=selType;this.next(true); }}
        ]);
      });
    }

    /* ── Stage 4: Name & DOB ── */
    s4(){
      const sc=document.getElementById('stage-content');
      sc.innerHTML=`
        ${renderProgressBar(4,10)}
        <h2 class="stage-heading">Your Details</h2>
        <p class="stage-sub">Make sure these match your BVN records exactly</p>
        <div style="display:flex;flex-direction:column;gap:.875rem;margin-bottom:1.5rem">
          <div>
            <label style="display:block;font-size:.875rem;font-weight:500;color:#1c1c1c;margin-bottom:.4rem">First Name</label>
            <input type="text" id="first-name" class="input-field" placeholder="John" value="${registrationState.firstName||''}">
          </div>
          <div>
            <label style="display:block;font-size:.875rem;font-weight:500;color:#1c1c1c;margin-bottom:.4rem">Middle Name <span style="color:#999;font-weight:400">(optional)</span></label>
            <input type="text" id="middle-name" class="input-field" placeholder="Michael" value="${registrationState.middleName||''}">
          </div>
          <div>
            <label style="display:block;font-size:.875rem;font-weight:500;color:#1c1c1c;margin-bottom:.4rem">Last Name</label>
            <input type="text" id="last-name" class="input-field" placeholder="Doe" value="${registrationState.lastName||''}">
          </div>
          <div>
            <label style="display:block;font-size:.875rem;font-weight:500;color:#1c1c1c;margin-bottom:.4rem">Date of Birth</label>
            <div class="dob-row">
              <select id="dob-month" class="input-field">
                <option value="">Month</option>
                ${['January','February','March','April','May','June','July','August','September','October','November','December'].map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}">${m}</option>`).join('')}
              </select>
              <select id="dob-day" class="input-field">
                <option value="">Day</option>
                ${Array.from({length:31},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${i+1}</option>`).join('')}
              </select>
              <select id="dob-year" class="input-field">
                <option value="">Year</option>
                ${Array.from({length:100},(_,i)=>{ const y=new Date().getFullYear()-18-i; return `<option value="${y}">${y}</option>`; }).join('')}
              </select>
            </div>
            <p style="font-size:.8rem;color:#999;margin-top:.35rem">Must match your BVN records exactly</p>
          </div>
          <div>
            <label style="display:block;font-size:.875rem;font-weight:500;color:#1c1c1c;margin-bottom:.5rem">Gender</label>
            <div style="display:flex;gap:.75rem">
              <label class="gender-option"><input type="radio" name="gender" value="1" id="gender-male" ${registrationState.gender==='1'?'checked':''}><span>Male</span></label>
              <label class="gender-option"><input type="radio" name="gender" value="2" id="gender-female" ${registrationState.gender==='2'?'checked':''}><span>Female</span></label>
            </div>
          </div>
        </div>
        <button id="next-btn" class="btn-primary">Continue</button>
      `;
      if(registrationState.dob){
        const [m,d,y]=registrationState.dob.split('/');
        document.getElementById('dob-month').value=m;
        document.getElementById('dob-day').value=d;
        document.getElementById('dob-year').value=y;
      }
      ['first-name','middle-name','last-name'].forEach(id=>{
        document.getElementById(id).addEventListener('input',e=>{ e.target.value=e.target.value.replace(/[^a-zA-Z\s]/g,''); });
      });
      document.getElementById('next-btn').addEventListener('click',()=>{
        const fn=document.getElementById('first-name').value.trim();
        const mn=document.getElementById('middle-name').value.trim();
        const ln=document.getElementById('last-name').value.trim();
        const dm=document.getElementById('dob-month').value;
        const dd=document.getElementById('dob-day').value;
        const dy=document.getElementById('dob-year').value;
        const gm=document.getElementById('gender-male').checked;
        const gf=document.getElementById('gender-female').checked;
        if(!fn||!ln){ showModal('Required','Please enter your first and last name',[{text:'OK',primary:true,onClick:()=>{}}]); return; }
        if(!dm||!dd||!dy){ showModal('Required','Please select your complete date of birth',[{text:'OK',primary:true,onClick:()=>{}}]); return; }
        if(!gm&&!gf){ showModal('Required','Please select your gender',[{text:'OK',primary:true,onClick:()=>{}}]); return; }
        registrationState.firstName=fn; registrationState.middleName=mn; registrationState.lastName=ln;
        registrationState.dob=`${dm}/${dd}/${dy}`; registrationState.gender=gm?'1':'2';
        this.next(true);
      });
    }

    /* ── Stage 5: Virtual account creation ── */
    s5(){
      const sc=document.getElementById('stage-content');
      sc.innerHTML=`
        ${renderProgressBar(5,10)}
        <div style="text-align:center;padding:1rem 0">
          <h2 class="stage-heading">Creating Your Account</h2>
          <p class="stage-sub">Verifying your identity and setting up your ScrowPay account…</p>
          <div class="spinner"></div>
          <p id="status-msg" style="color:#666;font-size:.9rem">Connecting to Squad…</p>
        </div>
      `;
      this.createVirtualAccount();
    }

    async createVirtualAccount(){
      const st=document.getElementById('status-msg');
      if(!st) return;
      try{
        if(st) st.textContent='Verifying your identity with NIBSS…';
        if(!squadService) throw new Error('Squad service unavailable');
        const data={
          customer_identifier:registrationState.phoneNumber,
          first_name:registrationState.firstName, last_name:registrationState.lastName, middle_name:registrationState.middleName||'',
          mobile_num:registrationState.phoneNumber.replace('+234','0'),
          email:`${registrationState.phoneNumber.replace(/\+/g,'')}@scrowpay.com`,
          bvn:registrationState.idNumber, dob:registrationState.dob, gender:registrationState.gender,
          address:`${registrationState.currentAddress.addressText||'N/A'}, Nigeria`,
          beneficiary_account:'0123456789'
        };
        if(st) st.textContent='Creating your virtual account…';
        const res=await squadService.createVirtualAccount(data);
        if(res.success){
          registrationState.virtualAccountNumber=res.data.virtual_account_number;
          registrationState.bankCode=res.data.bank_code;
          registrationState.verificationStatus.idVerified=true;
          showModal('Account Ready! 🎉',`Account Number: ${res.data.virtual_account_number}\nBank: GTBank (${res.data.bank_code})`,[{text:'Continue',primary:true,onClick:()=>this.next(true)}]);
        } else {
          showModal('Verification Failed',res.message||'Please check your details and try again.',[{text:'Retry',primary:true,onClick:()=>this.createVirtualAccount()},{text:'Go Back',primary:false,onClick:()=>this.prev()}]);
        }
      }catch(e){
        showModal('Error','An error occurred. Please try again.',[{text:'Retry',primary:true,onClick:()=>this.createVirtualAccount()},{text:'Go Back',primary:false,onClick:()=>this.prev()}]);
      }
    }

    /* ── Stage 6: Face intro ── */
    s6(){
      const sc=document.getElementById('stage-content');
      sc.innerHTML=`
        ${renderProgressBar(6,10)}
        <div style="text-align:center;padding:1rem 0">
          <h2 class="stage-heading">Face Verification</h2>
          <p class="stage-sub">We'll confirm you are the BVN holder with a quick liveness check</p>
          <svg width="96" height="96" fill="none" stroke="#caff04" stroke-width="1.5" viewBox="0 0 24 24" style="margin:1.5rem auto;display:block">
            <path d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div style="background:#f5f5f7;border-radius:.75rem;padding:1rem;margin-bottom:1.5rem;text-align:left">
            <p style="font-size:.875rem;color:#666;margin:0">Position your face in the oval frame and blink naturally when prompted. Make sure you are in a well-lit area.</p>
          </div>
          <button id="start-btn" class="btn-primary">Start Verification</button>
        </div>
      `;
      document.getElementById('start-btn').addEventListener('click',()=>this.next(true));
    }

    /* ── Stage 7: Blink detection ── */
    s7(){
      const sc=document.getElementById('stage-content');
      sc.innerHTML=`
        ${renderProgressBar(7,10)}
        <div style="text-align:center">
          <h2 class="stage-heading">Blink Detection</h2>
          <p class="stage-sub">Position your face and blink your eyes</p>
          <div class="video-container" style="margin-bottom:1.25rem">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" width="640" height="480"></canvas>
            <div class="oval-overlay"></div>
          </div>
          <p id="status-message" style="color:#666;font-size:.9rem">Initializing camera…</p>
        </div>
      `;
      this.initBlink();
    }

    async initBlink(){
      const vid=document.getElementById('video');
      const cvs=document.getElementById('canvas');
      const msg=document.getElementById('status-message');
      try{
        if(typeof MediaPipeService==='undefined') throw new Error('MediaPipe not loaded');
        if(!MediaPipeService.isLibraryLoaded()) throw new Error('MediaPipe library not ready');
        const mp=new MediaPipeService(vid,cvs);
        msg.textContent='Loading face detection…';
        await mp.initialize();
        msg.textContent='Position your face in the oval and blink';
        await mp.startDetection(()=>{
          msg.textContent='Blink detected! Processing…';
          mp.stopDetection();
          registrationState.verificationStatus.faceVerified=true;
          setTimeout(()=>this.renderProcessing(),500);
        });
      }catch(e){
        let em='An error occurred during face verification.';
        if(e.name==='NotAllowedError') em='Camera access is required. Please allow camera access and try again.';
        else if(e.name==='NotFoundError') em='No camera found. Please connect a camera.';
        else if(e.message&&e.message.includes('MediaPipe')) em='Face detection library failed to load. Check your connection.';
        if(msg){ msg.textContent=em; msg.style.color='#ef4444'; }
        showModal('Camera Error',em,[{text:'Retry',primary:true,onClick:()=>this.s7()},{text:'Go Back',primary:false,onClick:()=>this.prev()}]);
      }
    }

    renderProcessing(){
      document.getElementById('stage-content').innerHTML=`
        <div style="text-align:center;padding:1rem 0">
          <h2 class="stage-heading">Checking…</h2>
          <div class="spinner"></div>
          <p style="color:#666;margin-bottom:.75rem">Almost done</p>
          <div class="pct-counter" id="pct">0%</div>
        </div>
      `;
      let n=0;
      const delay=1500+Math.random()*500;
      const iv=setInterval(()=>{
        n++;
        const el=document.getElementById('pct');
        if(el) el.textContent=`${n}%`;
        if(n>=100){ clearInterval(iv); setTimeout(()=>showModal('Verified! ✓','Your face has been verified successfully.',[{text:'Continue',primary:true,onClick:()=>this.next(true)}]),300); }
      },delay/100);
    }

    /* ── Stage 8: Address ── */
    s8(){
      if(!addressDataLoaded){
        showModal('Loading','Loading address data, please wait…',[]);
        const tryLoad=()=>{
          if(addressDataService){ addressDataService.loadData().then(()=>{ addressDataLoaded=true; hideModal(); this.s8(); }).catch(()=>showModal('Error','Failed to load address data.',[{text:'Retry',primary:true,onClick:()=>tryLoad()},{text:'Go Back',primary:false,onClick:()=>this.prev()}])); }
          else { hideModal(); this.s8(); }
        };
        tryLoad(); return;
      }
      const sc=document.getElementById('stage-content');
      sc.innerHTML=`
        ${renderProgressBar(8,10)}
        <h2 class="stage-heading">Residential Address</h2>
        <p class="stage-sub">Please provide your current and permanent addresses</p>

        <div class="address-section" style="margin-bottom:1rem">
          <h3>Current Address</h3>
          <div style="display:flex;flex-direction:column;gap:.75rem">
            <select id="cur-state" class="input-field"><option value="">Select State</option></select>
            <select id="cur-lga"   class="input-field" disabled><option value="">Select LGA</option></select>
            <select id="cur-area"  class="input-field" disabled><option value="">Select Area</option></select>
            <input type="text" id="cur-addr"     class="input-field" placeholder="Street address">
            <input type="text" id="cur-landmark" class="input-field" placeholder="Landmark / nearest bus stop (optional)">
          </div>
        </div>

        <label class="same-address-label" style="margin-bottom:.75rem">
          <input type="checkbox" id="same-addr" checked>
          Same as current address
        </label>

        <div id="perm-section" style="display:none">
          <div class="address-section" style="margin-bottom:1rem">
            <h3>Permanent Address</h3>
            <div style="display:flex;flex-direction:column;gap:.75rem">
              <select id="perm-state" class="input-field"><option value="">Select State</option></select>
              <select id="perm-lga"   class="input-field" disabled><option value="">Select LGA</option></select>
              <select id="perm-area"  class="input-field" disabled><option value="">Select Area</option></select>
              <input type="text" id="perm-addr" class="input-field" placeholder="Street address">
            </div>
          </div>
        </div>

        <button id="next-btn" class="btn-primary" style="margin-top:.5rem">Continue</button>
      `;

      const states=addressDataService?addressDataService.getStates():[];
      const populate=(sel,opts)=>{ opts.forEach(o=>{ const op=document.createElement('option');op.value=o;op.textContent=capitalizeWords(o);sel.appendChild(op); }); };
      populate(document.getElementById('cur-state'),states);
      populate(document.getElementById('perm-state'),states);

      const cascadeAddr=(stateSel,lgaSel,areaSel)=>{
        stateSel.addEventListener('change',()=>{
          lgaSel.innerHTML='<option value="">Select LGA</option>';
          areaSel.innerHTML='<option value="">Select Area</option>';
          areaSel.disabled=true;
          if(stateSel.value&&addressDataService){ populate(lgaSel,addressDataService.getLGAsForState(stateSel.value)); lgaSel.disabled=false; }
          else lgaSel.disabled=true;
        });
        lgaSel.addEventListener('change',()=>{
          areaSel.innerHTML='<option value="">Select Area</option>';
          if(lgaSel.value&&addressDataService){ populate(areaSel,addressDataService.getWardsForLGA(stateSel.value,lgaSel.value)); areaSel.disabled=false; }
          else areaSel.disabled=true;
        });
      };
      cascadeAddr(document.getElementById('cur-state'),document.getElementById('cur-lga'),document.getElementById('cur-area'));
      cascadeAddr(document.getElementById('perm-state'),document.getElementById('perm-lga'),document.getElementById('perm-area'));

      document.getElementById('same-addr').addEventListener('change',e=>{
        document.getElementById('perm-section').style.display=e.target.checked?'none':'block';
      });

      document.getElementById('next-btn').addEventListener('click',()=>{
        const cs=document.getElementById('cur-state').value;
        const cl=document.getElementById('cur-lga').value;
        const ca=document.getElementById('cur-area').value;
        const cat=document.getElementById('cur-addr').value.trim();
        const clm=document.getElementById('cur-landmark').value.trim();
        if(!cs||!cl||!ca||!cat){ showModal('Required','Please complete all current address fields',[{text:'OK',primary:true,onClick:()=>{}}]); return; }
        registrationState.currentAddress={state:cs,lga:cl,area:ca,addressText:cat,landmark:clm};
        const same=document.getElementById('same-addr').checked;
        if(same){
          registrationState.permanentAddress={state:cs,lga:cl,area:ca,addressText:cat};
        } else {
          const ps=document.getElementById('perm-state').value;
          const pl=document.getElementById('perm-lga').value;
          const pa=document.getElementById('perm-area').value;
          const pat=document.getElementById('perm-addr').value.trim();
          if(!ps||!pl||!pa||!pat){ showModal('Required','Please complete all permanent address fields',[{text:'OK',primary:true,onClick:()=>{}}]); return; }
          registrationState.permanentAddress={state:ps,lga:pl,area:pa,addressText:pat};
        }
        this.next(true);
      });
    }

    /* ── Stage 9: PIN ── */
    s9(){
      const sc=document.getElementById('stage-content');
      sc.innerHTML=`
        ${renderProgressBar(9,10)}
        <h2 class="stage-heading">Set Your PIN</h2>
        <p class="stage-sub">Choose a secure 6-digit PIN for your account</p>
        <div style="margin-bottom:1.25rem">
          <label style="display:block;font-size:.875rem;font-weight:500;color:#1c1c1c;margin-bottom:.6rem">Create PIN</label>
          <div id="pin-wrap" style="margin-bottom:1.25rem"></div>
          <label style="display:block;font-size:.875rem;font-weight:500;color:#1c1c1c;margin-bottom:.6rem">Confirm PIN</label>
          <div id="pin-confirm-wrap"></div>
        </div>
        <button id="next-btn" class="btn-primary">Create Account</button>
      `;
      const p1=new DigitInputBox(6,null,'masked');
      const p2=new DigitInputBox(6,null,'masked');
      document.getElementById('pin-wrap').appendChild(p1.render());
      document.getElementById('pin-confirm-wrap').appendChild(p2.render());
      p1.focus();
      const btn=document.getElementById('next-btn');
      btn.addEventListener('click',async()=>{
        const pin=p1.getValue(); const pc=p2.getValue();
        if(typeof PINService!=='undefined'){
          const vr=PINService.validatePIN(pin);
          if(!vr.isValid){ showModal('Invalid PIN',vr.error,[{text:'OK',primary:true,onClick:()=>{}}]); return; }
        }
        if(pin!==pc){ showModal('Mismatch','PINs do not match. Please try again.',[{text:'OK',primary:true,onClick:()=>{}}]); return; }
        registrationState.pin=pin;
        if(!dbConnected||!dbService){ this.next(true); return; }
        try{
          btn.disabled=true; btn.textContent='Creating account…';
          const hashed=typeof PINService!=='undefined'?await PINService.hashPIN(pin,registrationState.phoneNumber):pin;
          const userData={
            phoneNumber:registrationState.phoneNumber, idType:registrationState.idType, idNumber:registrationState.idNumber,
            firstName:registrationState.firstName, middleName:registrationState.middleName, lastName:registrationState.lastName,
            dob:registrationState.dob, gender:registrationState.gender,
            virtualAccountNumber:registrationState.virtualAccountNumber, bankCode:registrationState.bankCode,
            currentAddress:registrationState.currentAddress, permanentAddress:registrationState.permanentAddress,
            hashedPin:hashed
          };
          await dbService.saveUser(userData);
          btn.disabled=false; btn.textContent='Create Account';
          this.next(true);
        }catch(e){
          btn.disabled=false; btn.textContent='Create Account';
          showModal('Error','Failed to create account: '+e.message,[{text:'Retry',primary:true,onClick:()=>btn.click()},{text:'Cancel',primary:false,onClick:()=>{}}]);
        }
      });
    }

    /* ── Stage 10: Success ── */
    s10(){
      const sc=document.getElementById('stage-content');
      sc.innerHTML=`
        <div style="text-align:center;padding:1.5rem 0;cursor:pointer" id="success-screen">
          <div class="success-checkmark">
            <svg width="48" height="48" fill="none" stroke="#1c1c1c" stroke-width="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <h2 class="stage-heading">Account Created!</h2>
          <p class="stage-sub" style="margin-bottom:2rem">Your ScrowPay account is ready to use.</p>
          <button class="btn-primary" id="go-dashboard">Go to Dashboard</button>
          <p style="font-size:.8rem;color:#bbb;margin-top:1rem">or tap anywhere to continue</p>
        </div>
      `;
      const go=()=>{
        window.dispatchEvent(new CustomEvent('accountCreationComplete',{detail:{phoneNumber:registrationState.phoneNumber,firstName:registrationState.firstName,lastName:registrationState.lastName}}));
        window.location.href=`dashboard.html?firstName=${encodeURIComponent(registrationState.firstName||'')}&phone=${encodeURIComponent(registrationState.phoneNumber||'')}`;
      };
      document.getElementById('success-screen').addEventListener('click',go);
      document.getElementById('go-dashboard').addEventListener('click',e=>{e.stopPropagation();go();});
    }
  }
