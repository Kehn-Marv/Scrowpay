<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ScrowPay</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #caff04;
      --dark: #111111;
      --page-bg: #f2f2f0;
      --card-bg: #ffffff;
      --muted: #888888;
      --border: rgba(0,0,0,0.09);
      --radius: 24px;
      --shadow: 0 4px 32px rgba(0,0,0,0.07);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Background blobs ── */
    body::before {
      content: '';
      position: fixed;
      top: -120px; right: -120px;
      width: 380px; height: 380px;
      background: var(--green);
      border-radius: 50%;
      opacity: 0.13;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; left: -100px;
      width: 300px; height: 300px;
      background: #111;
      border-radius: 50%;
      opacity: 0.05;
      pointer-events: none;
    }

    /* ── Logo ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      text-decoration: none;
    }
    .logo-mark {
      width: 40px; height: 40px;
      background: var(--dark);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-mark svg { width: 20px; height: 20px; }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 20px; font-weight: 700;
      color: var(--dark); letter-spacing: 0.02em;
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 32px 28px;
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border);
      animation: fadeUp 0.45s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px; font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 14px; color: var(--muted);
      margin-bottom: 28px;
    }

    /* ── Phone field ── */
    .field-label {
      font-size: 13px; font-weight: 500;
      color: var(--dark); margin-bottom: 8px;
      display: block;
    }
    .phone-row {
      display: flex; align-items: center;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
      background: #fafafa;
    }
    .phone-row:focus-within { border-color: var(--dark); background: #fff; }
    .phone-row.error { border-color: #ef4444; }

    .phone-prefix {
      padding: 0 14px;
      font-size: 15px; font-weight: 500;
      color: var(--dark);
      border-right: 1.5px solid var(--border);
      height: 52px;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .phone-input {
      flex: 1; border: none; outline: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; color: var(--dark);
      padding: 0 16px;
      height: 52px;
    }
    .phone-input::placeholder { color: #bbb; }

    .field-error {
      font-size: 12px; color: #ef4444;
      margin-top: 6px; min-height: 18px;
      display: block;
    }

    /* ── PIN section ── */
    .pin-section { margin-top: 24px; }
    .pin-label-row {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    /* PIN dots display */
    .pin-dots {
      display: flex; gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid #ddd;
      background: transparent;
      transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
    }
    .pin-dot.filled {
      background: var(--dark);
      border-color: var(--dark);
      transform: scale(1.15);
    }
    .pin-dot.error-dot {
      border-color: #ef4444;
      background: #ef4444;
    }

    /* ── PIN Pad ── */
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .pin-key {
      height: 64px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: #fafafa;
      font-family: 'DM Sans', sans-serif;
      font-size: 20px; font-weight: 500;
      color: var(--dark);
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1px;
      transition: all 0.15s cubic-bezier(0.34,1.56,0.64,1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }
    .pin-key sub {
      font-size: 8px; font-weight: 500;
      color: var(--muted); letter-spacing: 0.08em;
      line-height: 1;
    }
    .pin-key:hover { background: #f0f0ee; border-color: #ccc; transform: scale(1.03); }
    .pin-key:active { transform: scale(0.95); background: #e8e8e5; }

    .pin-key.key-zero { grid-column: 2; }
    .pin-key.key-del {
      grid-column: 3;
      font-size: 18px;
      background: transparent;
      border-color: transparent;
    }
    .pin-key.key-del:hover { background: #fef2f2; border-color: #fecaca; }
    .pin-key.key-del svg { width: 22px; height: 22px; stroke: #888; fill: none; }

    /* ── Shake animation ── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%      { transform: translateX(-10px); }
      30%      { transform: translateX(10px); }
      45%      { transform: translateX(-8px); }
      60%      { transform: translateX(8px); }
      75%      { transform: translateX(-4px); }
      90%      { transform: translateX(4px); }
    }
    .shake { animation: shake 0.5s ease; }

    /* ── Sign In Button ── */
    .btn-signin {
      width: 100%; height: 54px;
      border-radius: 50px;
      border: none;
      background: var(--dark);
      color: var(--green);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      position: relative; overflow: hidden;
    }
    .btn-signin:hover { background: #222; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    .btn-signin:active { transform: translateY(0); }
    .btn-signin:disabled { background: #ccc; color: #999; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-signin .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(202,255,4,0.3);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer link ── */
    .card-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px; color: var(--muted);
    }
    .card-footer a {
      color: var(--dark); font-weight: 600;
      text-decoration: none;
    }
    .card-footer a:hover { text-decoration: underline; }

    /* ── Modal ── */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 500;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .modal-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px 28px;
      width: 100%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      animation: fadeUp 0.3s ease both;
    }
    .modal-title { font-family:'Syne',sans-serif; font-size:20px; font-weight:700; margin-bottom:8px; color:var(--dark); }
    .modal-msg { font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:24px; }
    .modal-btns { display:flex; gap:10px; justify-content:flex-end; }
    .modal-btn {
      padding: 10px 22px; border-radius: 50px;
      font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600;
      cursor:pointer; border:none; transition:all 0.18s;
    }
    .modal-btn.primary { background:var(--dark); color:var(--green); }
    .modal-btn.primary:hover { background:#222; }
    .modal-btn.ghost { background:#f0f0ee; color:var(--dark); }
    .modal-btn.ghost:hover { background:#e5e5e2; }

    /* ── Ripple animation ── */
    @keyframes ripplePad {
      from { opacity: 1; transform: scale(0.6); }
      to   { opacity: 0; transform: scale(2); }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 28px 20px 24px; border-radius: 20px; }
      .pin-key { height: 58px; font-size: 18px; border-radius: 14px; }
      .card-title { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to your ScrowPay account</p>

    <!-- Phone -->
    <label class="field-label" for="phone-input">Phone Number</label>
    <div class="phone-row" id="phone-row">
      <div class="phone-prefix">🇳🇬 +234</div>
      <input class="phone-input" id="phone-input" type="tel" placeholder="8135866028" maxlength="11" inputmode="numeric">
    </div>
    <span class="field-error" id="phone-error"></span>

    <!-- PIN -->
    <div class="pin-section">
      <div class="pin-label-row">
        <label class="field-label" style="margin:0">6-Digit PIN</label>
      </div>

      <!-- Dots -->
      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot" data-i="0"></div>
        <div class="pin-dot" data-i="1"></div>
        <div class="pin-dot" data-i="2"></div>
        <div class="pin-dot" data-i="3"></div>
        <div class="pin-dot" data-i="4"></div>
        <div class="pin-dot" data-i="5"></div>
      </div>

      <!-- PIN Pad -->
      <div class="pin-pad" id="pin-pad">
        <button class="pin-key" data-val="1">1</button>
        <button class="pin-key" data-val="2">2<sub>ABC</sub></button>
        <button class="pin-key" data-val="3">3<sub>DEF</sub></button>
        <button class="pin-key" data-val="4">4<sub>GHI</sub></button>
        <button class="pin-key" data-val="5">5<sub>JKL</sub></button>
        <button class="pin-key" data-val="6">6<sub>MNO</sub></button>
        <button class="pin-key" data-val="7">7<sub>PQRS</sub></button>
        <button class="pin-key" data-val="8">8<sub>TUV</sub></button>
        <button class="pin-key" data-val="9">9<sub>WXYZ</sub></button>
        <div></div><!-- spacer -->
        <button class="pin-key key-zero" data-val="0">0</button>
        <button class="pin-key key-del" id="del-btn" aria-label="Delete">
          <svg viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12H9m0 0l4-4m-4 4l4 4M3 12a9 9 0 110 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19 12H9l4-4M9 12l4 4"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-signin" id="signin-btn">Sign In</button>

    <div class="card-footer">
      Don't have an account?
      <a href="account-creation.html">Create Account</a>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-msg" id="modal-msg"></div>
      <div class="modal-btns" id="modal-btns"></div>
    </div>
  </div>

  <!-- External services -->
  <script src="https://cdn.jsdelivr.net/npm/@libsql/client@0.3.5/dist/index.js"></script>
  <script src="env.js"></script>
  <script src="config.js"></script>
  <script src="turso-db-service.js"></script>
  <script src="pin-service.js?v=2"></script>
  <script src="SessionService.js"></script>

  <script>
    // PhoneValidationService
    class PhoneValidationService {
      static validateFormat(phone) {
        if (!phone || typeof phone !== 'string') {
          return false;
        }
        
        const cleaned = phone.replace(/\D/g, '');
        
        if (cleaned.length === 11 && cleaned.startsWith('0')) {
          return true;
        }
        
        if (cleaned.length === 10 && !cleaned.startsWith('0')) {
          return true;
        }
        
        return false;
      }
      
      static normalizePhone(phone) {
        if (!phone || typeof phone !== 'string') {
          throw new Error('Invalid phone number');
        }
        
        const cleaned = phone.replace(/\D/g, '');
        const withoutLeadingZero = cleaned.startsWith('0') ? cleaned.substring(1) : cleaned;
        
        return `+234${withoutLeadingZero}`;
      }
    }

    /* ── PIN state ── */
    let pinDigits = [];
    const MAX = 6;

    const dotsEl  = document.getElementById('pin-dots');
    const padEl   = document.getElementById('pin-pad');
    const delBtn  = document.getElementById('del-btn');
    const signinBtn = document.getElementById('signin-btn');
    const phoneInput = document.getElementById('phone-input');
    const phoneRow   = document.getElementById('phone-row');
    const phoneErr   = document.getElementById('phone-error');

    function renderDots(isError = false) {
      dotsEl.querySelectorAll('.pin-dot').forEach((dot, i) => {
        dot.classList.remove('filled','error-dot');
        if (isError) { dot.classList.add('error-dot'); return; }
        if (i < pinDigits.length) dot.classList.add('filled');
      });
    }

    function shakeCard() {
      const card = document.getElementById('card');
      card.classList.remove('shake');
      void card.offsetWidth; /* reflow */
      card.classList.add('shake');
      card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
    }

    function triggerError() {
      renderDots(true);
      shakeCard();
      setTimeout(() => {
        pinDigits = [];
        renderDots();
      }, 700);
    }

    /* PIN pad clicks */
    padEl.querySelectorAll('.pin-key[data-val]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (pinDigits.length >= MAX) return;
        pinDigits.push(btn.dataset.val);
        renderDots();
        /* ripple */
        const r = document.createElement('span');
        r.style.cssText = `position:absolute;width:100%;height:100%;left:0;top:0;background:rgba(0,0,0,0.06);border-radius:inherit;animation:ripplePad 0.3s ease;pointer-events:none;`;
        btn.appendChild(r);
        setTimeout(() => r.remove(), 320);
      });
    });

    delBtn.addEventListener('click', () => {
      if (!pinDigits.length) return;
      pinDigits.pop();
      renderDots();
    });

    /* Keyboard support */
    document.addEventListener('keydown', e => {
      if (document.activeElement === phoneInput) return;
      if (/^[0-9]$/.test(e.key) && pinDigits.length < MAX) {
        pinDigits.push(e.key); renderDots();
      }
      if (e.key === 'Backspace') { pinDigits.pop(); renderDots(); }
      if (e.key === 'Enter' && pinDigits.length === MAX) {
        signinBtn.click();
      }
    });

    /* ── Phone validation ── */
    phoneInput.addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '');
      if (e.target.value) {
        const ok = PhoneValidationService.validateFormat(e.target.value);
        phoneRow.classList.toggle('error', !ok);
        phoneErr.textContent = ok ? '' : 'Enter a valid Nigerian phone number';
      } else {
        phoneRow.classList.remove('error');
        phoneErr.textContent = '';
      }
    });

    /* ── Modal ── */
    function showModal(title, msg, buttons) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-msg').textContent   = msg;
      const btns = document.getElementById('modal-btns');
      btns.innerHTML = '';
      buttons.forEach(b => {
        const el = document.createElement('button');
        el.className = 'modal-btn ' + (b.primary ? 'primary' : 'ghost');
        el.textContent = b.text;
        el.onclick = () => { hideModal(); b.onClick && b.onClick(); };
        btns.appendChild(el);
      });
      document.getElementById('modal').classList.add('active');
    }
    function hideModal() { document.getElementById('modal').classList.remove('active'); }

    /* ── Initialize Turso DB Service from CONFIG ── */
    const dbService = new TursoDBService(
      window.CONFIG.turso.databaseUrl,
      window.CONFIG.turso.authToken
    );
    
    /* ── Initialize Session Service ── */
    const sessionService = new SessionService({
      turso: {
        databaseUrl: window.CONFIG.turso.databaseUrl,
        authToken: window.CONFIG.turso.authToken
      }
    });
    
    let dbConnected = false;
    
    /* ── Connect to database ── */
    dbService.connect()
      .then(async () => {
        dbConnected = true;
        console.log('[Sign In] Database connected');
        try {
          // Automatically initialize all schemas
          await dbService.initializeAllSchemas();
          console.log('[Sign In] ✅ All database schemas ready');
        } catch (schemaError) {
          console.error('[Sign In] ⚠️ Schema initialization warning:', schemaError);
        }
      })
      .catch(error => {
        console.error('[Sign In] Database connection failed:', error);
      });
    
    /* ── Check for redirect reason and display message ── */
    const redirectReason = sessionStorage.getItem('redirect_reason');
    if (redirectReason) {
      sessionStorage.removeItem('redirect_reason');
      
      let message = '';
      switch (redirectReason) {
        case 'session_expired':
          message = 'Your session has expired. Please sign in again.';
          break;
        case 'inactivity_timeout':
          message = 'You were signed out due to inactivity. Please sign in again.';
          break;
        case 'logout':
          message = 'You have been signed out successfully.';
          break;
        case 'no_session':
          message = 'Please sign in to access the dashboard.';
          break;
        default:
          message = 'Please sign in to continue.';
      }
      
      showModal('Session Expired', message, [
        { text: 'OK', primary: true, onClick: () => {} }
      ]);
    }

    /* ── Sign In ── */
    signinBtn.addEventListener('click', async () => {
      const phone = phoneInput.value.trim();

      // Validate phone
      if (!phone || !PhoneValidationService.validateFormat(phone)) {
        phoneRow.classList.add('error');
        phoneErr.textContent = 'Please enter a valid Nigerian phone number';
        shakeCard();
        return;
      }
      
      // Validate PIN
      if (pinDigits.length !== MAX) {
        triggerError();
        return;
      }

      const normalizedPhone = PhoneValidationService.normalizePhone(phone);
      const pin = pinDigits.join('');

      // Check database connection
      if (!dbConnected) {
        showModal('Connection Error', 'Unable to reach the server. Please check your internet connection.', [
          { text: 'Retry', primary: true, onClick: () => signinBtn.click() },
          { text: 'Cancel', primary: false }
        ]);
        return;
      }

      signinBtn.disabled = true;
      signinBtn.innerHTML = '<div class="spinner"></div>';

      try {
        // Get user from database
        const user = await dbService.getUserByPhone(normalizedPhone);
        
        if (!user) {
          signinBtn.disabled = false;
          signinBtn.textContent = 'Sign In';
          showModal('Account Not Found', 'No account found with this phone number. Please create an account first.', [
            { text: 'Create Account', primary: true, onClick: () => window.location.href = 'account-creation.html' },
            { text: 'Try Again', primary: false }
          ]);
          triggerError();
          return;
        }

        // Verify PIN
        const isPINValid = await PINService.verifyPIN(pin, normalizedPhone, user.hashed_pin);
        
        if (!isPINValid) {
          signinBtn.disabled = false;
          signinBtn.textContent = 'Sign In';
          triggerError();
          showModal('Incorrect PIN', 'The PIN you entered is incorrect. Please try again.', [
            { text: 'OK', primary: true }
          ]);
          return;
        }

        // Success! Create session and redirect to dashboard
        const sessionResult = sessionService.createSession(user);
        
        if (!sessionResult.success) {
          signinBtn.disabled = false;
          signinBtn.textContent = 'Sign In';
          showModal('Error', 'Failed to create session. Please try again.', [
            { text: 'OK', primary: true }
          ]);
          return;
        }

        signinBtn.innerHTML = '✓ Success';
        signinBtn.style.background = '#1a7f37';

        showModal('Welcome Back!', `Welcome back, ${user.first_name}! Redirecting to your dashboard...`, [
          { text: 'Continue', primary: true, onClick: () => window.location.href = 'dashboard.html' }
        ]);
        
        // Auto-redirect after 2 seconds
        setTimeout(() => window.location.href = 'dashboard.html', 2000);

      } catch (error) {
        console.error('Sign in error:', error);
        signinBtn.disabled = false;
        signinBtn.textContent = 'Sign In';
        showModal('Error', 'Something went wrong. Please try again.', [
          { text: 'OK', primary: true }
        ]);
        triggerError();
      }
    });

    /* ── Enter key handler ── */
    phoneInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        signinBtn.click();
      }
    });
  </script>
</body>
</html>
